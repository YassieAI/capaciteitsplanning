/* ---------- jaaroverzicht (Manager G): mini-trendlijn per locatie ---------- */
var yOff=0;   // jaren t.o.v. huidig jaar
function yNav(d){yOff+=d;render();}
var jaarWeergave='grafiek';   // 'grafiek' = trendlijn per locatie | 'tabel' = cijfermatrix
function jaarSetWeergave(w){jaarWeergave=w;render();}
// Eén compacte jaarlijn voor één locatie. Onder de normlijn ligt een rode zone, zodat een dip
// meteen leesbaar is zonder cijfers. Gaten (weken zonder planning) breken de lijn op.
function jaarSpark(vals, weeks, curWkMon, naam){
  var n=vals.length, W=1000, H=42, step=n>1?W/(n-1):W, MAXV=150;
  function yv(v){return H-(Math.min(v,MAXV)/MAXV*H);}
  var normY=yv(60);
  var segs=[],cur=[];
  vals.forEach(function(v,i){
    if(v===null){if(cur.length>1)segs.push(cur.join(' '));cur=[];return;}
    cur.push((i*step).toFixed(1)+','+yv(v).toFixed(1));
  });
  if(cur.length>1)segs.push(cur.join(' '));
  var lijnen=segs.map(function(pts){
    return '<polyline points="'+pts+'" fill="none" stroke="#185fa5" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>';
  }).join('');
  // losse punten (week met data zonder buren) + rode markers onder norm
  var punten=vals.map(function(v,i){
    if(v===null)return '';
    var alleen=(i===0||vals[i-1]===null)&&(i===n-1||vals[i+1]===null);
    if(v>=60&&!alleen)return '';
    var x=(i*step).toFixed(1), y=yv(v).toFixed(1);
    return '<circle cx="'+x+'" cy="'+y+'" r="'+(v<60?2.6:2)+'" fill="'+(v<60?'var(--risk-bar)':'#185fa5')+'"/>';
  }).join('');
  var nuX=null;
  weeks.forEach(function(wk,i){if(fmtIsoD(wk)===curWkMon)nuX=(i*step).toFixed(1);});
  // onzichtbare klikvlakken per week → hergebruikt de bestaande data-kwweek-afhandeling
  var zones=weeks.map(function(wk,i){
    var v=vals[i];
    return '<rect class="jr-zone" x="'+((i-0.5)*step).toFixed(1)+'" y="0" width="'+step.toFixed(1)+'" height="'+H+'" fill="transparent" data-kwweek="'+fmtIsoD(wk)+'">'+
      '<title>'+naam+' · week '+isoWeek(wk)+' · '+(v===null?'geen gegevens':v+'%')+'</title></rect>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:42px;display:block" role="img" aria-label="jaarverloop '+naam+'">'+
    '<rect x="0" y="'+normY.toFixed(1)+'" width="'+W+'" height="'+(H-normY).toFixed(1)+'" fill="var(--risk-bar)" opacity="0.10"/>'+
    '<line x1="0" y1="'+normY.toFixed(1)+'" x2="'+W+'" y2="'+normY.toFixed(1)+'" stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="4 3"/>'+
    (nuX!==null?'<line x1="'+nuX+'" y1="0" x2="'+nuX+'" y2="'+H+'" stroke="var(--text)" stroke-width="1.5"/>':'')+
    lijnen+punten+zones+
  '</svg>';
}
// Maandlabels onder de laatste grafiek — vervangt de weeknummerrij van de tabel.
function jaarMaandAs(weeks){
  var n=weeks.length, W=1000, step=n>1?W/(n-1):W;
  var MND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  var gezien={}, labels='';
  weeks.forEach(function(wk,i){
    var don=new Date(wk); don.setDate(wk.getDate()+3);   // donderdag bepaalt de maand van een ISO-week
    var m=don.getMonth();
    if(gezien[m])return;
    gezien[m]=true;
    labels+='<text x="'+(i*step).toFixed(1)+'" y="11" font-size="10" fill="var(--muted)" text-anchor="start">'+MND[m]+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' 14" preserveAspectRatio="none" style="width:100%;height:14px;display:block">'+labels+'</svg>';
}
function viewJaar(){
  var jaar=new Date().getFullYear()+yOff;
  // ISO-weken: week 1 is de week waarin 4 januari valt
  var eersteMa=mondayOf(new Date(jaar,0,4));
  var laatste=new Date(jaar,11,31);
  var weeks=[];for(var d=new Date(eersteMa);d<=laatste;d.setDate(d.getDate()+7))weeks.push(new Date(d));
  var eindIso=fmtIsoD(new Date(weeks[weeks.length-1].getTime()+6*86400000));
  var agg=ensureRange('y_'+jaar,fmtIsoD(eersteMa),eindIso);
  var laden=!agg||!agg.loaded;
  function weekDek(l,wkMon){
    if(laden)return null;
    var som=0,heeft=false;
    for(var i=0;i<5;i++){var dd=new Date(wkMon);dd.setDate(wkMon.getDate()+i);var b=(agg.byLocDay[l.id]||{})[fmtIsoD(dd)];if(b!==undefined){som+=b;heeft=true;}}
    if(!heeft)return null;
    return Math.round(som/(l.benodigd*5)*100);
  }
  var curWkMon=fmtIsoD(mondayOf(new Date()));
  // kwartaalscheiding: eerste week waarvan de donderdag in een nieuw kwartaal valt
  function qVan(wk){var do_=new Date(wk);do_.setDate(wk.getDate()+3);return Math.floor(do_.getMonth()/3);}
  var qSep={};var vorigQ=null;
  weeks.forEach(function(wk,i){var q=qVan(wk);if(vorigQ!==null&&q!==vorigQ)qSep[i]=true;vorigQ=q;});
  var qRow='<td class="hm-lab"></td>'+weeks.map(function(wk,i){
    var q=qVan(wk);var eersteVanQ=(i===0)||qSep[i];
    return '<td class="qlab'+(qSep[i]?' q-sep':'')+'" style="text-align:center">'+(eersteVanQ?'Q'+(q+1):'')+'</td>';
  }).join('');
  var head='<td class="hm-lab"></td>'+weeks.map(function(wk,i){
    var nowW=fmtIsoD(wk)===curWkMon;
    return '<td class="hm-day'+(nowW?' kw-now kw-now-top':'')+(qSep[i]?' q-sep':'')+'">'+(nowW?'<span style="color:var(--text);font-weight:700;font-size:9px">NU</span><br>':'')+isoWeek(wk)+'</td>';
  }).join('');
  var onder=0;var gemeten=0;var onderList=[];
  var locs=gLocs();
  // één keer rekenen, daarna hergebruikt door zowel de grafiek- als de tabelweergave
  var perLoc=locs.map(function(l){
    var vals=weeks.map(function(wk){return weekDek(l,wk);});
    var meet=vals.filter(function(v){return v!==null;});
    var laag=[];
    vals.forEach(function(v,i){if(v!==null){gemeten++;if(v<60){onder++;laag.push(i);onderList.push({naam:l.naam,weekNo:isoWeek(weeks[i]),dek:v});}}});
    return {naam:l.naam, vals:vals, onderWeken:laag.length,
      gem:(meet.length?Math.round(meet.reduce(function(a,b){return a+b;},0)/meet.length):null)};
  });

  var body='';
  perLoc.forEach(function(pl,li){
    var laatsteRij=li===perLoc.length-1;
    var tds='';
    weeks.forEach(function(wk,i){
      var dek=pl.vals[i];
      var wIso=fmtIsoD(wk);
      var nowW=wIso===curWkMon;
      var cls=(nowW?'kw-now'+(laatsteRij?' kw-now-bottom':''):'')+(qSep[i]?' q-sep':'');
      var tdCls=cls.trim()?' class="'+cls.trim()+'"':'';
      if(dek===null){tds+='<td'+tdCls+'><button class="hm-cell hm-cell-click" data-kwweek="'+wIso+'" style="background:var(--surface-1);color:var(--muted)" title="Klik voor weekdetail — week '+isoWeek(wk)+'">'+(laden?'…':'–')+'</button></td>';return;}
      var t=tone(dek);
      tds+='<td'+tdCls+'><button class="hm-cell hm-cell-click" data-kwweek="'+wIso+'" style="background:'+t.bg+';color:'+t.tx+'" title="Klik voor weekdetail — week '+isoWeek(wk)+', '+dek+'%">'+dek+'</button></td>';
    });
    body+='<tr><td class="hm-lab">'+pl.naam+'</td>'+tds+'</tr>';
  });

  var nav='<div class="ctrl" style="margin-bottom:10px"><button onclick="yNav(-1)">‹ jaar</button><span class="daylabel" style="min-width:90px">'+jaar+'</span><button onclick="yNav(1)">jaar ›</button>'+(yOff!==0?' <button class="linkbtn" onclick="yOff=0;render()">naar nu</button>':'')+'</div>';
  var wisselaar='<div class="ctrl" style="margin-bottom:12px">'+
    '<button class="'+(jaarWeergave==='grafiek'?'active':'')+'" onclick="jaarSetWeergave(\'grafiek\')">Grafiek</button>'+
    '<button class="'+(jaarWeergave==='tabel'?'active':'')+'" onclick="jaarSetWeergave(\'tabel\')">Cijfers</button>'+
  '</div>';
  var kpis='<div class="metrics" style="grid-template-columns:repeat(2,1fr)">'+
     gKpiCard('q-onder','Locatie-weken onder norm',(gemeten?onder+' / '+gemeten:'–'),(onder?'var(--risk)':'var(--ok)'),'')+
     gKpiCard(null,'Gevuld',(laden?'laden…':gemeten+' locatie-weken'),'','18px')+
   '</div>'+
   (gKpiSel==='q-onder'? gKpiPanel('Locatie-weken onder norm (&lt;60%)', onderList.length? onderList.map(function(x){return '<strong>'+x.naam+'</strong> · week '+x.weekNo+' · '+x.dek+'%';}) : ['Geen — alle locatie-weken op norm.']) : '');

  var kop='<h2>Jaaroverzicht '+jaar+'</h2><p class="sub">dekking per locatie over '+weeks.length+' weken · oude regio-indeling · alleen-lezen · klik in een grafiek op een week voor het dag-voor-dag Weekdashboard</p>'+nav+wisselaar;

  if(jaarWeergave==='tabel'){
    return kop+
     '<div style="display:flex;gap:14px;margin-bottom:8px;font-size:12px;color:var(--muted)">'+
     '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--ok-bar);vertical-align:-1px"></span> OK ≥60</span>'+
     '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--warn-bar);vertical-align:-1px"></span> let op 45–59</span>'+
     '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--risk-bar);vertical-align:-1px"></span> risico &lt;45</span>'+
     '<span>– = geen gegevens</span></div>'+
     '<div class="hm"><table class="hm-t hm-jaar"><tr>'+qRow+'</tr><tr>'+head+'</tr>'+body+'</table></div>'+kpis+
     '<p class="sub" style="margin-top:6px">Huidige week zwart omkaderd · Q-scheidingen als lijn · scroll horizontaal voor de latere weken.</p>';
  }

  // ---- grafiekweergave: één mini-trendlijn per locatie ----
  var maandAs=jaarMaandAs(weeks);
  var rijen=perLoc.map(function(pl){
    var status=pl.onderWeken? '<span style="color:var(--risk);font-weight:600">'+pl.onderWeken+' wk onder norm</span>'
                            : '<span style="color:var(--ok);font-weight:600">op norm</span>';
    return '<div class="jr-rij">'+
      '<div class="jr-naam">'+pl.naam+'</div>'+
      '<div class="jr-graf">'+jaarSpark(pl.vals,weeks,curWkMon,pl.naam)+'</div>'+
      '<div class="jr-cijfer">'+(pl.gem===null?'<span style="color:var(--muted)">geen data</span>':'gem. <strong>'+pl.gem+'%</strong>')+'<br>'+status+'</div>'+
    '</div>';
  }).join('');
  return kop+
   '<div style="display:flex;gap:16px;margin-bottom:10px;font-size:12px;color:var(--muted);align-items:center">'+
     '<span><span style="display:inline-block;width:16px;height:2px;background:#185fa5;vertical-align:3px"></span> dekking per week</span>'+
     '<span><span style="display:inline-block;width:16px;height:0;border-top:1.5px dashed var(--border-strong);vertical-align:3px"></span> norm 60%</span>'+
     '<span><span style="display:inline-block;width:12px;height:9px;background:var(--risk-bg,rgba(200,60,60,.13));vertical-align:-1px;border-radius:2px"></span> zone onder norm</span>'+
     '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--risk-bar);vertical-align:-1px"></span> week onder norm</span>'+
   '</div>'+
   '<div class="jr-lijst">'+rijen+'</div>'+
   '<div class="jr-rij jr-as"><div class="jr-naam"></div><div class="jr-graf">'+maandAs+'</div><div class="jr-cijfer"></div></div>'+
   kpis+
   '<p class="sub" style="margin-top:6px">Elke lijn is één locatie over heel '+jaar+'. Zakt de lijn in de rode zone, dan zat die week onder de norm. De zwarte streep is de huidige week; klik op een week voor het dagdetail.</p>';
}
function wireKwartaal(){
  document.querySelectorAll('[data-kwweek]').forEach(function(b){
    b.onclick=function(){
      var mondayIso=b.dataset.kwweek, p=mondayIso.split('-').map(Number);
      var targetMon=new Date(p[0],p[1]-1,p[2]);

/* ---------- Manager G: grafieken ---------- */
var grafiekSel=null;  // key van de regio waarvan het detailpaneel openstaat (Grafiek-tab)
var trendSelIdx=null; // dag-index waarvan het label is opgeroepen (klik op een punt) — gedeeld over alle trendlijnen
// Bouwt een trendlijn-SVG met normlijn en rode vandaag-lijn. Alleen vandaag heeft een vast label —
// overige punten tonen hun label pas na een klik (voorkomt een dichtgeplakte grafiek).
// opts.labels: eigen labels per punt (bv. weekdagen of weeknummers) — anders dChip(i) (dag-modus, 14 pts).
// opts.todIdx: welke index 'vandaag' is (-1 = geen vandaag in beeld) — anders de globale TODAY (dag-modus).
// opts.dayIsos: ISO-datum per punt (lengte n) — zo kan de rode lijn gesleept worden om curDay elders in de app te
// wijzigen (schuifbord/weekrooster/heatmap reageren mee); zonder dayIsos werkt slepen alleen als lokale selectie
// (bv. het kwartaal-niveau, waar een punt een hele week is, geen dag).
function trendSvg(pts, opts){
  opts=opts||{};
  var n=pts.length;
  var W=opts.w||640, H=opts.h||150;
  var pl=34, pr=10, pt=24, pb=24;                 // marges: links y-as, onder x-as
  var plotW=W-pl-pr, plotH=H-pt-pb, step=n>1?plotW/(n-1):plotW;
  var labels=opts.labels||null;
  var dayIsos=opts.dayIsos||null;
  var todIdx=(opts.todIdx!==undefined)?opts.todIdx:TODAY;
  var top=100; pts.forEach(function(p){if(p>top)top=Math.ceil(p/50)*50;});   // schaal groeit mee, niets wordt afgekapt
  function X(i){return pl+i*step;}
  function Y(v){return pt+plotH*(1-Math.min(v,top)/top);}
  var normY=Y(60), baseY=Y(0);
  var hasTod=todIdx>=0&&todIdx<n;
  var todX=hasTod?X(todIdx).toFixed(1):'-10';
  // achtergrond: rustig vlak onder de norm (zelfde taal als het jaaroverzicht) + lichte hulplijnen
  var grid='';
  for(var gv=0;gv<=top;gv+=50){
    grid+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(gv).toFixed(1)+'" y2="'+Y(gv).toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>'+
          '<text x="'+(pl-6)+'" y="'+(Y(gv)+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+gv+'%</text>';
  }
  var zone='<rect x="'+pl+'" y="'+normY.toFixed(1)+'" width="'+plotW+'" height="'+(baseY-normY).toFixed(1)+'" fill="var(--risk-bar)" opacity="0.08"/>';
  var normLijn='<line x1="'+pl+'" y1="'+normY.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+normY.toFixed(1)+'" stroke="var(--border-strong)" stroke-width="1.2" stroke-dasharray="5 4"/>'+
    '<text x="'+(W-pr-2)+'" y="'+(normY-4).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--muted)">norm 60%</text>';
  var poly=pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p).toFixed(1);}).join(' ');
  var area='<polygon points="'+X(0).toFixed(1)+','+baseY.toFixed(1)+' '+poly+' '+X(n-1).toFixed(1)+','+baseY.toFixed(1)+'" fill="#185fa5" opacity="0.05"/>';
  // x-as: niet elk label als de lijn te vol wordt
  var every=n>24?4:(n>14?2:1);
  var xas=pts.map(function(p,i){
    if(i%every!==0&&i!==todIdx)return '';
    var chip=labels?labels[i]:dChip(i);
    var isT=hasTod&&i===todIdx;
    return '<text x="'+X(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="9.5" '+(isT?'font-weight="700" fill="var(--risk)"':'fill="var(--muted)"')+'>'+chip+'</text>';
  }).join('');
  var dots=pts.map(function(p,i){
    var x=X(i).toFixed(1), y=Y(p).toFixed(1);
    var isTod=hasTod&&i===todIdx, isSel=i===trendSelIdx&&!isTod, onder=p<60;
    var showLbl=isTod||isSel;
    var chip=labels?labels[i]:dChip(i);
    var lbl=isTod?(chip+' · '+p+'% · vandaag'):(chip+' · '+p+'%');
    var dotR=(isTod||isSel)?4.5:(onder?3.2:2.4);
    var dotFill=isTod?'var(--risk-bar)':(onder?'var(--risk-bar)':'#185fa5');
    var rechts=(i>n/2);
    var lx=isTod?(rechts?(+x-7):(+x+7)):x;
    var ly=isTod?(pt-11):((i%2===0)?(+y-10):(+y+17));
    ly=Math.max(isTod?10:pt+6, Math.min(ly, baseY-4));
    var anchor=isTod?(rechts?'end':'start'):'middle';
    return '<g class="trendg">'+
      '<circle cx="'+x+'" cy="'+y+'" r="'+dotR+'" fill="'+dotFill+'" stroke="var(--bg)" stroke-width="'+((isTod||isSel)?1.8:1)+'"/>'+
      '<text class="trendlbl'+(showLbl?' always':'')+'" data-i="'+i+'" x="'+lx+'" y="'+ly+'" text-anchor="'+anchor+'" font-size="10" font-weight="'+(isTod?'700':'600')+'" fill="'+(isTod?'var(--risk)':'#185fa5')+'">'+lbl+'</text>'+
    '</g>';
  }).join('');
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;overflow:visible" role="img" aria-label="trendlijn dekking — sleep de lijn of tik een punt voor detail">'+
   zone+grid+normLijn+area+
   '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+baseY.toFixed(1)+'" y2="'+baseY.toFixed(1)+'" stroke="var(--border-strong)" stroke-width="1"/>'+
   '<line class="trendline-now" x1="'+todX+'" y1="'+pt+'" x2="'+todX+'" y2="'+baseY.toFixed(1)+'" stroke="var(--risk-bar)" stroke-width="1.5"'+(hasTod?'':' style="display:none"')+'/>'+
   '<polyline points="'+poly+'" fill="none" stroke="#185fa5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
   xas+dots+
   // topmost, onzichtbaar vlak dat de hele plot dekt — vangt hover én sleep, ongeacht hoe dicht bij een punt
   '<rect class="trendhit" x="'+pl+'" y="0" width="'+plotW+'" height="'+(H-pb+8)+'" fill="transparent"/>'+
   '</svg>';
  var legenda='<div style="display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 0;font-size:12px;color:var(--muted);align-items:center">'+
    '<span><span style="display:inline-block;width:16px;height:2px;background:#185fa5;vertical-align:3px"></span> dekking</span>'+
    '<span><span style="display:inline-block;width:12px;height:9px;background:var(--risk-bar);opacity:.13;vertical-align:-1px;border-radius:2px"></span> onder norm</span>'+
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--risk-bar);vertical-align:-1px"></span> punt onder norm</span>'+
    '<span style="font-style:italic">&#128070; sleep de rode lijn of tik een punt voor datum en percentage</span></div>';
  return '<div class="trendwrap" data-n="'+n+'" data-w="'+W+'" data-h="'+H+'" data-pl="'+pl+'" data-step="'+step.toFixed(4)+'"'+(dayIsos?' data-isos="'+dayIsos.join(',')+'"':'')+'>'+svg+legenda+'</div>';
}
// Elke rol onthoudt zijn eigen periode-keuze in Grafiek — RD's "Grafiek"-tab en G's "Dagdashboard"-tab
// delen dezelfde weergavefunctie maar mogen niet elkaars stand overnemen (RD start op Week, G op Dag).
var grafiekPeriodeRD='week'; // 'dag' | 'week' | 'kwartaal' — Manager R/D, tabblad "Grafiek"
var grafiekPeriodeG='dag';   // 'dag' | 'week' | 'kwartaal' — Manager G, tabblad "Dagdashboard"
function grafiekPeriode(){ return role==='G' ? grafiekPeriodeG : grafiekPeriodeRD; }
function grafiekSetPeriode(p){ if(role==='G') grafiekPeriodeG=p; else grafiekPeriodeRD=p; grafiekSel=null; trendSelIdx=null; render(); }
function grafiekPeriodeNav(d){ var p=grafiekPeriode(); if(p==='week') wgOff+=d; else if(p==='kwartaal') qOff+=d; render(); }
// Gemiddelde dekking% voor col over een reeks Date-objecten, o.b.v. een ensureRange-aggregaat. null = geen data.
function aggRangeAvg(agg, col, dates){
  if(!agg||!agg.loaded) return null;
  var som=0, heeft=false;
  dates.forEach(function(d){
    var iso=fmtIsoD(d);
    col.members.forEach(function(locId){ var v=agg.byLocDay[locId]&&agg.byLocDay[locId][iso]; if(v!==undefined){som+=v;heeft=true;} });
  });
  return heeft ? Math.round(som/(col.benodigd*dates.length)*100) : null;
}
// Gemiddelde dekking% over meerdere regio's, voor één specifieke dag.
function aggDayAvg(agg, cols, d){
  if(!agg||!agg.loaded) return null;
  var iso=fmtIsoD(d);
  var vals=cols.map(function(c){
    var som=0,heeft=false;
    c.members.forEach(function(locId){ var v=agg.byLocDay[locId]&&agg.byLocDay[locId][iso]; if(v!==undefined){som+=v;heeft=true;} });
    return heeft?Math.round(som/c.benodigd*100):null;
  }).filter(function(v){return v!==null;});
  return vals.length ? Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length) : null;
}
// Gedeelde opbouw van de staven+labels+KPI's — hergebruikt door de dag/week/kwartaal-varianten.
function grafiekBarsBlock(vals, laden, klikOmschrijving){
  var gemVals=vals.filter(function(x){return x.d!==null;});
  var gem=gemVals.length?Math.round(gemVals.reduce(function(a,b){return a+b.d;},0)/gemVals.length):null;
  var onder=gemVals.filter(function(x){return x.d<60;});
  var risk=gemVals.length?gemVals.slice().sort(function(a,b){return a.d-b.d;})[0]:null;
  var bars=vals.map(function(x){
    var sel=grafiekSel===x.key;
    if(x.d===null){
      return '<div class="barc barc-click'+(sel?' barc-sel':'')+'" data-bar="'+x.key+'" title="'+(laden?'laden…':'geen gegevens')+'">'+
        '<span class="barv" style="color:var(--muted)">'+(laden?'…':'–')+'</span><div class="bar" style="height:2%;background:var(--surface-1)"></div></div>';
    }
    var t=tone(x.d);
    return '<div class="barc barc-click'+(sel?' barc-sel':'')+'" data-bar="'+x.key+'" title="Klik voor '+klikOmschrijving+' van '+x.naam+'">'+
      '<span class="barv" style="color:'+t.tx+'">'+x.d+'</span>'+
      '<div class="bar" style="height:'+Math.max(2,Math.min(100,x.d))+'%;background:'+t.bar+'"></div>'+
    '</div>';
  }).join('');
  var labs=vals.map(function(x){var sel=grafiekSel===x.key;return '<span style="'+(sel?'font-weight:700;color:var(--text)':'')+'">'+x.naam.replace('Regio ','')+'</span>';}).join('');
  return {bars:bars,labs:labs,gem:gem,onder:onder,risk:risk,gemVals:gemVals};
}
function viewManagerG(){
  /* Manager G kijkt altijd naar de oude regio-indeling (5 regio's), los van de RD-groepering */
  var regs=LOC.filter(function(l){return l.type==='regio';}).map(function(l){return colFor(l.id);});
  if(role==='RD'&&groupMode==='cluster3')regs=columns().filter(function(c){return c.type==='cluster';}); // RD: volg de keuze '3 clusters'
  var periode=grafiekPeriode();
  var toggle='<div class="ctrl" style="margin-bottom:10px">'+
    '<button class="'+(periode==='dag'?'active':'')+'" onclick="grafiekSetPeriode(\'dag\')">Dag</button>'+
    '<button class="'+(periode==='week'?'active':'')+'" onclick="grafiekSetPeriode(\'week\')">Week</button>'+
    '<button class="'+(periode==='kwartaal'?'active':'')+'" onclick="grafiekSetPeriode(\'kwartaal\')">Kwartaal</button>'+
    '<button class="'+(periode==='jaar'?'active':'')+'" onclick="grafiekSetPeriode(\'jaar\')">Jaar</button>'+
  '</div>';
  if(periode==='week') return toggle+viewGrafiekWeek(regs);
  if(periode==='kwartaal') return toggle+viewGrafiekKwartaal(regs);
  if(periode==='jaar') return toggle+viewGrafiekJaar(regs);
  return toggle+viewGrafiekDag(regs);
}
/* ---- Jaar-niveau: één mini-trendlijn per regio/cluster over alle weken van het jaar ---- */
function viewGrafiekJaar(cols){
  var jaar=new Date().getFullYear()+yOff;
  var eersteMa=mondayOf(new Date(jaar,0,4));
  var laatste=new Date(jaar,11,31);
  var weeks=[];for(var d=new Date(eersteMa);d<=laatste;d.setDate(d.getDate()+7))weeks.push(new Date(d));
  var eindIso=fmtIsoD(new Date(weeks[weeks.length-1].getTime()+6*86400000));
  var agg=ensureRange('y_'+jaar,fmtIsoD(eersteMa),eindIso);
  var laden=!agg||!agg.loaded;
  function werkdagen(wkMon){var out=[];for(var i=0;i<5;i++){var dd=new Date(wkMon);dd.setDate(wkMon.getDate()+i);out.push(dd);}return out;}
  var curWkMon=fmtIsoD(mondayOf(new Date()));

  var onder=0,gemeten=0,onderList=[];
  var perCol=cols.map(function(c){
    var vals=weeks.map(function(wk){return laden?null:aggRangeAvg(agg,c,werkdagen(wk));});
    var meet=vals.filter(function(v){return v!==null;});
    var laag=0;
    vals.forEach(function(v,i){if(v!==null){gemeten++;if(v<60){onder++;laag++;onderList.push({naam:c.naam,weekNo:isoWeek(weeks[i]),dek:v});}}});
    return {naam:c.naam, vals:vals, onderWeken:laag,
      gem:(meet.length?Math.round(meet.reduce(function(a,b){return a+b;},0)/meet.length):null)};
  });

  var nav='<div class="ctrl" style="margin-bottom:10px"><button onclick="yNav(-1)">‹ jaar</button><span class="daylabel" style="min-width:90px">'+jaar+'</span><button onclick="yNav(1)">jaar ›</button>'+(yOff!==0?' <button class="linkbtn" onclick="yOff=0;render()">naar nu</button>':'')+'</div>';
  var rijen=perCol.map(function(pl){
    var status=pl.onderWeken? '<span style="color:var(--risk);font-weight:600">'+pl.onderWeken+' wk onder norm</span>'
                            : '<span style="color:var(--ok);font-weight:600">op norm</span>';
    return '<div class="jr-rij">'+
      '<div class="jr-naam">'+pl.naam+'</div>'+
      '<div class="jr-graf">'+jaarSpark(pl.vals,weeks,curWkMon,pl.naam)+'</div>'+
      '<div class="jr-cijfer">'+(pl.gem===null?'<span style="color:var(--muted)">'+(laden?'laden…':'geen data')+'</span>':'gem. <strong>'+pl.gem+'%</strong>')+'<br>'+status+'</div>'+
    '</div>';
  }).join('');
  return nav+'<h2>Jaarverloop '+jaar+' · per regio</h2><p class="sub">dekking per week over '+weeks.length+' weken · norm 60% · alleen-lezen · klik in een grafiek op een week voor het dag-voor-dag detail</p>'+
   '<div style="display:flex;gap:16px;margin-bottom:10px;font-size:12px;color:var(--muted);align-items:center">'+
     '<span><span style="display:inline-block;width:16px;height:2px;background:#185fa5;vertical-align:3px"></span> dekking per week</span>'+
     '<span><span style="display:inline-block;width:16px;height:0;border-top:1.5px dashed var(--border-strong);vertical-align:3px"></span> norm 60%</span>'+
     '<span><span style="display:inline-block;width:12px;height:9px;background:var(--risk-bar);opacity:.13;vertical-align:-1px;border-radius:2px"></span> zone onder norm</span>'+
     '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--risk-bar);vertical-align:-1px"></span> week onder norm</span>'+
   '</div>'+
   '<div class="jr-lijst">'+rijen+'</div>'+
   '<div class="jr-rij jr-as"><div class="jr-naam"></div><div class="jr-graf">'+jaarMaandAs(weeks)+'</div><div class="jr-cijfer"></div></div>'+
   '<div class="metrics" style="grid-template-columns:repeat(2,1fr)">'+
     '<div class="metric"><div class="l">Regio-weken onder norm</div><div class="v" style="color:'+(onder?'var(--risk)':'var(--ok)')+'">'+(gemeten?onder+' / '+gemeten:'–')+'</div></div>'+
     '<div class="metric"><div class="l">Gevuld</div><div class="v" style="font-size:18px">'+(laden?'laden…':gemeten+' regio-weken')+'</div></div>'+
   '</div>'+
   '<p class="sub" style="margin-top:6px">Elke lijn is één regio over heel '+jaar+'. De zwarte streep is de huidige week.</p>';
}
/* ---- Dag-niveau: bestaand gedrag (14-daagse trend rond curDay) ---- */
function viewGrafiekDag(regs){
  var vals=regs.map(function(c){return {key:c.key,naam:c.naam,d:colDekking(c,curDay)};});
  var b=grafiekBarsBlock(vals,false,'2-weken detail');

  var perRegioPts={};
  regs.forEach(function(c){var arr=[];for(var d=0;d<14;d++)arr.push(colDekking(c,d));perRegioPts[c.key]=arr;});
  var pts=[];for(var d2=0;d2<14;d2++){var s=0;regs.forEach(function(c){s+=perRegioPts[c.key][d2];});pts.push(Math.round(s/regs.length));}
  var dayIsos14=[];for(var di=0;di<14;di++)dayIsos14.push(fmtIsoD(dateForIdx(di)));

  var detailHtml='';
  if(grafiekSel){
    var selCol=regs.filter(function(c){return c.key===grafiekSel;})[0];
    if(selCol){
      var selPts=perRegioPts[grafiekSel];
      var selDek=colDekking(selCol,curDay);
      detailHtml='<div class="ai" style="margin-top:14px"><div class="hd" style="justify-content:space-between">'+
        '<span><span class="dot"></span>'+selCol.naam+' · 2-weken detail</span>'+
        '<button class="linkbtn" data-barclose="1">sluiten ✕</button></div>'+
        '<div class="metrics" style="grid-template-columns:repeat(3,1fr);margin-top:8px">'+
        '<div class="metric"><div class="l">Vandaag</div><div class="v">'+selDek+'%</div></div>'+
        '<div class="metric"><div class="l">Beschikbaar</div><div class="v" style="font-size:16px">'+colBeschikbaar(selCol,curDay)+' / '+selCol.benodigd+'</div></div>'+
        '<div class="metric"><div class="l">Gem. 2 weken</div><div class="v">'+Math.round(selPts.reduce(function(a,b){return a+b;},0)/selPts.length)+'%</div></div></div>'+
        trendSvg(selPts,{h:130,todIdx:curDay,dayIsos:dayIsos14})+
      '</div>';
    }
  }
  return '<h2>Beschikbare capaciteit per regio · dag</h2><p class="sub">'+dLabel(curDay)+' · norm 60% · alleen-lezen totaaloverzicht · klik op een staaf voor detail</p>'+
   '<div class="chart"><div class="norm" style="bottom:60%"><span>norm 60%</span></div><div class="bars">'+b.bars+'</div></div>'+
   '<div class="blab">'+b.labs+'</div>'+
   '<div class="metrics"><div class="metric"><div class="l">Gem. dekking</div><div class="v">'+b.gem+'%</div></div>'+
   '<div class="metric"><div class="l">Regio\'s onder norm</div><div class="v" style="color:'+(b.onder.length?'var(--risk)':'var(--ok)')+'">'+b.onder.length+' / '+regs.length+'</div></div>'+
   '<div class="metric"><div class="l">Laagste deze dag</div><div class="v" style="font-size:18px">'+b.risk.naam.replace('Regio ','')+' · '+b.risk.d+'%</div></div></div>'+
   detailHtml+
   '<h2 style="margin-top:14px">Trend totale dekking · 2 weken</h2>'+
   trendSvg(pts,{todIdx:curDay,dayIsos:dayIsos14});
}
/* ---- Week-niveau (standaard): weekgemiddelde per regio + dag-detail bij doorklikken ---- */
function viewGrafiekWeek(regs){
  var mon=mondayOf(new Date()); mon.setDate(mon.getDate()+wgOff*7);
  var end=new Date(mon); end.setDate(mon.getDate()+6);
  var workdays=[]; for(var i=0;i<5;i++){var d=new Date(mon); d.setDate(mon.getDate()+i); workdays.push(d);}
  var alldays=[]; for(var j=0;j<7;j++){var d2=new Date(mon); d2.setDate(mon.getDate()+j); alldays.push(d2);}
  var agg=ensureRange('gweek_'+fmtIsoD(mon), fmtIsoD(mon), fmtIsoD(end));
  var laden=!agg||!agg.loaded;

  var vals=regs.map(function(c){return {key:c.key,naam:c.naam,d:laden?null:aggRangeAvg(agg,c,workdays)};});
  var b=grafiekBarsBlock(vals,laden,'dag-detail (deze week)');

  var todayD=new Date(); todayD.setHours(0,0,0,0);
  var todIdx=-1; for(var ti=0; ti<alldays.length; ti++){ if(fmtIsoD(alldays[ti])===fmtIsoD(todayD)){ todIdx=ti; break; } }
  var dayLabels=alldays.map(function(dd){return WD[dd.getDay()]+' '+dd.getDate();});
  var dayPts=alldays.map(function(dd){ var v=aggDayAvg(agg,regs,dd); return v===null?0:v; });
  var dayIsosWk=alldays.map(fmtIsoD);

  var detailHtml='';
  if(grafiekSel){
    var selCol=regs.filter(function(c){return c.key===grafiekSel;})[0];
    if(selCol){
      var selDayPts=alldays.map(function(dd){
        var iso=fmtIsoD(dd), som=0, heeft=false;
        selCol.members.forEach(function(locId){var v=agg.byLocDay[locId]&&agg.byLocDay[locId][iso]; if(v!==undefined){som+=v;heeft=true;}});
        return heeft?Math.round(som/selCol.benodigd*100):0;
      });
      var selGem=aggRangeAvg(agg,selCol,workdays);
      detailHtml='<div class="ai" style="margin-top:14px"><div class="hd" style="justify-content:space-between">'+
        '<span><span class="dot"></span>'+selCol.naam+' · dag-detail deze week</span>'+
        '<button class="linkbtn" data-barclose="1">sluiten ✕</button></div>'+
        '<div class="metrics" style="grid-template-columns:repeat(2,1fr);margin-top:8px">'+
        '<div class="metric"><div class="l">Weekgemiddelde</div><div class="v">'+(selGem===null?'–':selGem+'%')+'</div></div>'+
        '<div class="metric"><div class="l">Benodigd per dag</div><div class="v" style="font-size:16px">'+selCol.benodigd+'</div></div></div>'+
        trendSvg(selDayPts,{h:130,labels:dayLabels,todIdx:todIdx,dayIsos:dayIsosWk})+
      '</div>';
    }
  }

  var nav='<div class="ctrl" style="margin-bottom:10px"><button onclick="grafiekPeriodeNav(-1)">‹ week</button>'+
   '<span class="daylabel" style="min-width:190px">week '+isoWeek(mon)+' · '+mon.getDate()+'/'+(mon.getMonth()+1)+' – '+end.getDate()+'/'+(end.getMonth()+1)+' '+end.getFullYear()+'</span>'+
   '<button onclick="grafiekPeriodeNav(1)">week ›</button>'+(wgOff!==0?' <button class="linkbtn" onclick="wgOff=0;render()">naar nu</button>':'')+'</div>';

  return nav+'<h2>Gemiddelde capaciteit per regio · deze week</h2><p class="sub">week '+isoWeek(mon)+' · norm 60% · alleen-lezen · klik op een staaf voor dag-detail</p>'+

// Maakt de rode 'vandaag'-lijn in elke trendSvg-instantie sleepbaar. Bij drop op een dag met een bekende
// ISO-datum (opts.dayIsos) springt de globale curDay mee — schuifbord/weekrooster/heatmap reageren direct.
// Zonder dayIsos (kwartaal-niveau, punt = een week) pint slepen alleen het label vast, net als voorheen tikken.
function wireTrendDrag(){
  document.querySelectorAll('.trendwrap').forEach(function(wrap){
    var svg=wrap.querySelector('svg'), rect=wrap.querySelector('.trendhit'), line=wrap.querySelector('.trendline-now');
    if(!svg||!rect)return;
    var n=+wrap.dataset.n, W=+wrap.dataset.w, pl=+(wrap.dataset.pl||0), step=+(wrap.dataset.step)||(n>1?W/(n-1):W);
    var isos=wrap.dataset.isos?wrap.dataset.isos.split(','):null;
    var dragging=false;
    function idxFromX(clientX){
      var r=svg.getBoundingClientRect();
      var x=(clientX-r.left)*(r.width?W/r.width:1)-pl;
      return Math.max(0,Math.min(n-1,Math.round(x/step)));
    }
    function preview(i){
      if(line){var x=(pl+i*step).toFixed(1);line.setAttribute('x1',x);line.setAttribute('x2',x);line.style.display='';}
      svg.querySelectorAll('.trendlbl').forEach(function(t){t.classList.remove('preview');});
      var t=svg.querySelector('.trendlbl[data-i="'+i+'"]');
      if(t)t.classList.add('preview');
    }
    rect.addEventListener('pointerdown',function(e){dragging=true;try{rect.setPointerCapture(e.pointerId);}catch(_){}preview(idxFromX(e.clientX));e.preventDefault();});
    rect.addEventListener('pointermove',function(e){if(dragging)preview(idxFromX(e.clientX));});
    rect.addEventListener('pointerleave',function(){if(!dragging)return;svg.querySelectorAll('.trendlbl').forEach(function(t){t.classList.remove('preview');});});
    rect.addEventListener('pointerup',function(e){
      if(!dragging)return;
      dragging=false;
      var i=idxFromX(e.clientX);
      if(isos&&isos[i]){var d=curDayIdxForIso(isos[i]);if(d!==null){curDay=d;pick=null;}}
      trendSelIdx=i;
      render();
    });
  });
}

function boardOutlook(cols){

      note='Gemiddelde dekking per week (werkdagen), komende 8 weken. Een &#8211; betekent: nog geen rooster ingevoerd. Een * betekent: maar een deel van de werkdagen is ingevoerd, het cijfer telt alleen die dagen.';
    } else {

      for(var k=0;k<4;k++){var idx=qi+k,yr=nu.getFullYear()+Math.floor(idx/4),q=idx%4;var a2=new Date(yr,q*3,1),e2=new Date(yr,q*3+3,0);perioden.push({van:a2,tot:e2,lab:'Q'+(q+1)+'<br><span style="font-size:9px;opacity:.7">'+yr+'</span>',now:k===0});}
      note='Gemiddelde dekking per kwartaal (werkdagen), dit en de drie volgende kwartalen. Een &#8211; betekent: nog geen rooster ingevoerd. Een * betekent: maar een deel van de werkdagen is ingevoerd, het cijfer telt alleen die dagen.';

    agg=ensureRange('ov_'+outlookMode+'_'+fmtIsoD(van2)+'_'+fmtIsoD(tot2),fmtIsoD(van2),fmtIsoD(tot2));
    laden=!agg||!agg.loaded;
    perioden.forEach(function(pd,i){
      var alle=olWorkdays(pd.van,pd.tot);
      // alleen werkdagen waarvoor al een rooster is ingevoerd tellen mee, anders lijkt een half ingevuld kwartaal onterecht rood
      pd.dagen=laden?[]:alle.filter(function(dd){var iso=fmtIsoD(dd);return Object.keys(agg.byLocDay).some(function(l){return agg.byLocDay[l][iso]!==undefined;});});
      pd.deel=alle.length?pd.dagen.length/alle.length:0;pd.nAlle=alle.length;
      heads.push({lab:pd.lab,now:pd.now,sel:false,id:i});});
    cellsFor=function(c,h){var pd=perioden[h.id];return (laden||!pd.dagen.length)?null:aggRangeAvg(agg,c,pd.dagen);};
    if(laden)note='Laden…';
  }
  var hrow='';heads.forEach(function(h){hrow+='<td class="hm-day'+(h.now?' hm-now':'')+'">'+h.lab+'</td>';});

    rows+='<tr><td class="hm-lab">'+c.naam+'</td>'+tds+'</tr>';});
  var legenda='<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--risk-bg);border:1px solid var(--risk-bar);vertical-align:-1px"></i> onder 45%</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--warn-bg);border:1px solid var(--warn-bar);vertical-align:-1px"></i> 45&#8211;59%</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--ok-bg);border:1px solid var(--ok-bar);vertical-align:-1px"></i> 60&#8211;99% (norm gehaald)</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--ruim-bg);border:1px solid var(--ruim-bar);vertical-align:-1px"></i> 100% of meer</span></div>';
  return '<div class="hm" style="margin-bottom:14px">'+head+'<table class="hm-t"><tr><td class="hm-lab"></td>'+hrow+'</tr>'+rows+'</table>'+legenda+'<p class="sub" style="margin:6px 0 0">'+note+'</p></div>';

function conceptDoel(){

/* Laat de tool zelf een paar uitwerkingen voorstellen: dezelfde tekorten, maar telkens met de
   eerstvolgende donor in de rangschikking. Zo krijg je echte alternatieven in plaats van één advies. */
function scenarioMogelijkheden(){
  var onder=columns().filter(function(c){return colDekking(c,curDay)<60;});
  if(!onder.length){pbToastLite('Geen locatie onder norm vandaag — niets voor te stellen');return;}
  scenarios=[];scenarioActief=null;scenarioTeller=0;
  for(var rang=0;rang<3;rang++){
    var mv={}, uitleg=[];
    conceptOverride=mv;   // elke volgende keuze houdt rekening met de vorige binnen dit scenario
    onder.forEach(function(c){
      var sug=suggestions(c,curDay);
      var s=sug[rang]||sug[0];
      if(!s||mv[s.m.id+':'+curDay])return;
      mv[s.m.id+':'+curDay]=primaryTarget(c,curDay);
      uitleg.push(s.m.ini+' → '+c.naam+' ('+s.dist+' km)');
    });
    conceptOverride=null;
    if(!uitleg.length)continue;
    var sleutel=JSON.stringify(mv);
    if(scenarios.some(function(x){return JSON.stringify(x.moves)===sleutel;}))continue;  // gelijke uitkomst overslaan
    scenarioTeller++;
    scenarios.push({id:'s'+scenarioTeller,naam:'Mogelijkheid '+String.fromCharCode(64+scenarioTeller),
      moves:mv,kleur:scenarioKleur(scenarioTeller-1),toelichting:uitleg.join(' · ')});
  }
  scenarioActief=scenarios.length?scenarios[0].id:null;
  if(!scenarios.length)pbToastLite('Geen donor beschikbaar zonder een andere locatie onder norm te duwen');
  render();
}
function conceptVastleggen(){
  var set=conceptSet(), keys=Object.keys(set);
  if(!keys.length)return;
  keys.forEach(function(k){var p=k.split(':');applyMove(p[0],+p[1],set[k]);});
  conceptMoves={};scenarios=[];scenarioActief=null;scenarioTeller=0;
  pbToastLite(keys.length+' verschuiving'+(keys.length===1?'':'en')+' vastgelegd');
  render();
}
function conceptWissen(){
  if(conceptStijl==='scenarios'){
    scenarios=scenarios.filter(function(x){return x.id!==scenarioActief;});
    scenarioActief=scenarios.length?scenarios[0].id:null;
  } else conceptMoves={};
  render();
}
function scenarioKies(id){scenarioActief=id;render();}
function scenarioNieuw(){scenarioActief=null;conceptDoel();render();}
/* Dekking doorrekenen alsóf een bepaald conceptpakket actief is — voor het vergelijken. */
function conceptMetriek(movesObj){
  var bewaar=conceptOverride; conceptOverride=movesObj||{};
  var deks=columns().map(function(c){return colDekking(c,curDay);});
  conceptOverride=bewaar;
  // gemiddelde verandert nauwelijks bij herverdelen — de zwakste plek is de zinvolle maat
  return {gem:deks.length?Math.round(deks.reduce(function(a,b){return a+b;},0)/deks.length):0,
          onder:deks.filter(function(d){return d<60;}).length, totaal:deks.length,
          laagste:deks.length?Math.min.apply(null,deks):0};
}

/* ---------- Balans: overbezetting <-> tekort, centraal bij R/D ---------- */
function offerFromOver(overCol,day){
  var shortages=columns().filter(function(c){return colDekking(c,day)<60;});
  var mon=colMonteurs(overCol,day).filter(function(m){return weight(m.roster[day],day)>0;});
  var opts=[];
  shortages.forEach(function(sh){
    mon.forEach(function(m){
      var overAfter=Math.round((colBeschikbaar(overCol,day)-weight(m.roster[day],day))/overCol.benodigd*100);
      if(overAfter<60)return;
      var shAfter=Math.round((colBeschikbaar(sh,day)+weight(m.roster[day],day))/sh.benodigd*100);
      var d=km(m.lat,m.lng,sh.lat,sh.lng);
      opts.push({m:m,sh:sh,dist:d,buiten:d>45,overAfter:overAfter,shAfter:shAfter});
    });
  });
  opts.sort(function(a,b){return a.dist-b.dist;});
  var seen={},top=[];opts.forEach(function(o){if(!seen[o.sh.key]){seen[o.sh.key]=1;top.push(o);}});
  return top;
}
/* ---------- Balans op weekniveau ----------
   Per-monteur detail bestaat alleen in het 14-daagse venster (m.roster), dus de weekweergave
   werkt op deze en volgende week. Weekenddagen blijven buiten beschouwing: daar staat niemand
   ingeroosterd, dus elke locatie zou "tekort" zijn zonder dat er iets te schuiven valt. */
var balansPeriode='week';   // 'dag' | 'week'
function balansSetPeriode(p){balansPeriode=p;render();}
var balansRuimteStijl='lijst';  // vaste keuze na vergelijking met 'blok' — die variant is eruit
function balansWerkdagen(){
  var out=[];for(var d=weekStart;d<weekStart+7;d++){if(!isWeekendIdx(d))out.push(d);}
  return out;
}
/* Alle (locatie, werkdag)-combinaties die deze week onder norm zitten. */
function balansProbleemDagen(){
  var dagen=balansWerkdagen(), cols=columns(), out=[];
  dagen.forEach(function(d){cols.forEach(function(c){var dek=colDekking(c,d);if(dek<60)out.push({col:c,d:d,dek:dek});});});
  return {dagen:dagen, cols:cols, problemen:out};
}
/* Elke probleemdag krijgt zijn beste donor; die worden gebundeld tot acties per monteur+locatie.
   Eén probleemdag hoort bij precies één actie, dus "lost N dagen op" telt nooit dubbel. */
function balansActies(){
  var pd=balansProbleemDagen(), kand={}, onoplosbaar=[];
  pd.problemen.forEach(function(p){
    var s=suggestions(p.col,p.d)[0];
    if(!s){onoplosbaar.push(p);return;}
    var k=s.m.id+'|'+p.col.key;
    if(!kand[k])kand[k]={m:s.m,col:p.col,donor:s.donor,dist:s.dist,buiten:s.buiten,items:[]};
    // haalt=true → de locatie komt met deze verplaatsing echt op de norm; anders alleen een verbetering
    kand[k].items.push({d:p.d,dek:p.dek,targetAfter:s.targetAfter,donorNow:s.donorNow,donorAfter:s.donorAfter,haalt:s.targetAfter>=60});
  });
  var acties=Object.keys(kand).map(function(k){return kand[k];})
    .sort(function(a,b){return (b.items.length-a.items.length)||(a.dist-b.dist);});
  return {pd:pd, acties:acties, onoplosbaar:onoplosbaar};
}
/* Waar deze week ruimte overblijft: locaties op/boven 100%, met per locatie wie er gemist kan
   worden en waar die naartoe zou kunnen. Zonder tekort ertegenover blijft het een signaal. */
function balansRuimte(){
  var dagen=balansWerkdagen(), cols=columns(), uit=[];
  cols.forEach(function(c){
    var dagenOver=[], aanbod={};
    dagen.forEach(function(d){
      var dek=colDekking(c,d);
      if(dek<100)return;
      // wat je kunt weggeven zonder zelf onder de norm van 60% te zakken (in hele monteurs)
      var mistbaar=Math.floor(colBeschikbaar(c,d)-0.6*c.benodigd+1e-9);
      dagenOver.push({d:d,dek:dek,mistbaar:Math.max(0,mistbaar)});
      offerFromOver(c,d).forEach(function(o){
        var k=o.m.id+'|'+o.sh.key;
        if(!aanbod[k])aanbod[k]={m:o.m,sh:o.sh,dist:o.dist,buiten:o.buiten,items:[]};
        aanbod[k].items.push({d:d,shAfter:o.shAfter,overAfter:o.overAfter});
      });
    });
    if(!dagenOver.length)return;
    var opties=Object.keys(aanbod).map(function(k){return aanbod[k];})
      .sort(function(a,b){return (b.items.length-a.items.length)||(a.dist-b.dist);});
    // op precies de norm zitten is geen ruimte: alleen tonen als er echt iemand gemist kan worden
    var maxMist=Math.max.apply(null,dagenOver.map(function(x){return x.mistbaar;}));
    if(!maxMist&&!opties.length)return;
    uit.push({col:c,dagen:dagenOver,opties:opties,maxMist:maxMist});
  });
  uit.sort(function(a,b){return b.dagen.length-a.dagen.length;});
  return uit;
}
/* Toont een reeks percentages compact: "50%" als ze gelijk zijn, anders "38–55%". */
function bereikTxt(getallen){
  var lo=Math.min.apply(null,getallen), hi=Math.max.apply(null,getallen);
  return lo===hi ? lo+'%' : lo+'–'+hi+'%';
}
/* ---- Weekniveau: één platte actielijst met uitleg per voorstel ---- */

    var nHaalt=a.items.filter(function(it){return it.haalt;}).length;

function wkPasToe(fn){
  var raak=editCells.length?editCells:(editCell?[editCell]:[]);
  raak.forEach(function(c){
    var m=M.filter(function(x){return x.id===c.mid;})[0];
    if(!m)return;
    fn(m,c.day);
    sbSaveStatus(m,c.day);
  });
  editCell=null;editCells=[];render();
}
function wireWeek(){
  function leeg(){editCell=null;editCells=[];}
  var p=document.getElementById('wkPrev');if(p)p.onclick=function(){weekStart=0;leeg();render();};
  var n=document.getElementById('wkNext');if(n)n.onclick=function(){weekStart=7;leeg();render();};
  document.querySelectorAll('[data-wkc]').forEach(function(b){b.onclick=function(){
    var k=b.dataset.wkc,wc=weekCols();
    if(k==='*'){weekSel=wc.map(function(c){return c.key;});}
    else{var i=weekSel.indexOf(k);if(i>=0){if(weekSel.length>1)weekSel.splice(i,1);}else weekSel.push(k);}
    leeg();render();};});

  /* ---- slepen over meerdere cellen: rechthoek tussen ankercel en cel onder de muis ---- */
  var cellen=[].slice.call(document.querySelectorAll('.wkcell'));
  var midVolgorde=[];  // monteurs in schermvolgorde, om een rij-bereik te kunnen bepalen
  cellen.forEach(function(el){if(midVolgorde.indexOf(el.dataset.mid)<0)midVolgorde.push(el.dataset.mid);});
  function bereik(a,b){
    var i1=midVolgorde.indexOf(a.mid), i2=midVolgorde.indexOf(b.mid);
    var mLo=Math.min(i1,i2), mHi=Math.max(i1,i2);
    var dLo=Math.min(a.day,b.day), dHi=Math.max(a.day,b.day);
    var out=[];
    for(var i=mLo;i<=mHi;i++)for(var d=dLo;d<=dHi;d++)out.push({mid:midVolgorde[i],day:d});
    return out;
  }
  function teken(){
    cellen.forEach(function(el){
      var raak=editCells.some(function(c){return c.mid===el.dataset.mid&&c.day===+el.dataset.day;});
      el.classList.toggle('wkcell-sel',raak);
    });
  }
  cellen.forEach(function(el){
    var mid=el.dataset.mid, day=+el.dataset.day;
    el.addEventListener('pointerdown',function(e){
      wkDrag.anker={mid:mid,day:day};wkDrag.bezig=true;wkDrag.verplaatst=false;
      editCells=[{mid:mid,day:day}];teken();e.preventDefault();
    });
    el.addEventListener('pointerenter',function(){
      if(!wkDrag.bezig||!wkDrag.anker)return;
      if(mid!==wkDrag.anker.mid||day!==wkDrag.anker.day)wkDrag.verplaatst=true;
      editCells=bereik(wkDrag.anker,{mid:mid,day:day});teken();
    });
  });
  // pointerup hangt aan document (loslaten mag buiten de tabel) en wordt maar één keer gekoppeld —
  // wireWeek draait bij elke render, dus een listener per render zou zich opstapelen
  if(!wkDrag.gekoppeld){
    wkDrag.gekoppeld=true;
    document.addEventListener('pointerup',function(){
      if(!wkDrag.bezig)return;
      wkDrag.bezig=false;
      var a=wkDrag.anker;
      // losse tik op de al geopende cel = sluiten (oud gedrag behouden)
      if(!wkDrag.verplaatst&&editCell&&a&&editCell.mid===a.mid&&editCell.day===a.day){editCell=null;editCells=[];render();return;}
      editCell=a;render();
    });
  }

  document.querySelectorAll('[data-set]').forEach(function(b){b.onclick=function(){var v=b.dataset.set;wkPasToe(function(m,day){m.roster[day]=v;});};});
  document.querySelectorAll('[data-hset]').forEach(function(b){b.onclick=function(){var type=b.dataset.hset;var inp=document.getElementById(type==='comp'?'compU':'verlU');var u=Math.max(1,Math.min(8,parseInt(inp.value,10)||0));wkPasToe(function(m,day){m.roster[day]=type+':'+u;});};});
  var t=document.getElementById('wkTarget');if(t)t.onchange=function(){if(!t.value)return;var src=M.filter(function(x){return x.id===editCell.mid;})[0];var tgt=M.filter(function(x){return x.id===t.value;})[0];var day=editCell.day;tgt.roster[day]=src.roster[day];src.roster[day]='vrij';sbSaveStatus(tgt,day);sbSaveStatus(src,day);editCell=null;editCells=[];render();};
  var c=document.getElementById('wkCancel');if(c)c.onclick=function(){editCell=null;editCells=[];render();};
}

        '<div class="metrics" style="grid-template-columns:repeat(3,1fr);margin-top:8px">'+
        '<div class="metric"><div class="l">Dekking</div><div class="v" style="color:'+t2.tx+'">'+dek2+'%</div></div>'+
        '<div class="metric"><div class="l">Beschikbaar</div><div class="v" style="font-size:16px">'+colBeschikbaar(selCol,dd)+' / '+selCol.benodigd+'</div></div>'+

        '<div class="cards" style="margin-top:10px">'+(monteursHtml||'<span style="color:var(--muted);font-size:12px">Geen monteurs op deze locatie.</span>')+'</div>'+
      '</div>';
    }
  }
  return '<h2>Weekheatmap</h2><p class="sub">'+title+' · dekking per locatie per dag · blader met ‹ week / week › verder terug of vooruit · geselecteerd: <strong>'+dLabel(curDay)+'</strong> — klik op een dag om te springen'+(live?', klik op een cel voor detail':'')+'</p>'+
   navHtml+
   '<div style="display:flex;gap:14px;margin-bottom:8px;font-size:12px;color:var(--muted)">'+
   '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--ok-bar);vertical-align:-1px"></span> OK ≥60</span>'+

   '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--risk-bar);vertical-align:-1px"></span> risico &lt;45</span></div>'+
   (live?'':'<p class="sub" style="margin-bottom:8px">Buiten het huidige venster tonen cellen alleen een samenvattingspercentage — geen monteursdetail of dag-selectie op celniveau.</p>')+
   '<div class="hm"><table class="hm-t"><tr><td class="hm-lab"></td>'+days+'</tr>'+rows+'</table></div>'+
   detailHtml;
}

/* ---------- Teamleider Noord/Zuid: eigen team met Midden op woonplaats ---------- */
function colFor(id){var l=LOCMAP[id];return {key:id,naam:l.naam,type:l.type,members:[id],benodigd:l.benodigd,lat:l.lat,lng:l.lng};}
function teamOf(m){
  if(m.base==='NW'||m.base==='NO')return 'Noord';
  if(m.base==='ZW'||m.base==='ZO')return 'Zuid';
  if(m.base==='MI')return m.lat>=52.055?'Noord':'Zuid';
  if(m.base==='ZAM'||m.base==='ZRO'||m.base==='ZAR'||m.base==='ZZW')return 'ZARA';
  return 'Techno';
}
function fBeschikbaar(col,day){var s=0;M.forEach(function(m){if(col.members.indexOf(locOf(m,day))>=0&&(!col.filt||col.filt(m)))s+=weight(m.roster[day],day);});return s;}
function fDekking(col,day){return Math.round(fBeschikbaar(col,day)/col.benodigd*100);}
function fMonteurs(col,day){var o=[];M.forEach(function(m){if(col.members.indexOf(locOf(m,day))>=0&&(!col.filt||col.filt(m)))o.push(m);});return o;}
function midSplit(){var mids=M.filter(function(m){return m.base==='MI';});var tot=mids.length||1;var n=mids.filter(function(m){return teamOf(m)==='Noord';}).length;var benN=Math.max(1,Math.round(n/tot*LOCMAP.MI.benodigd));return {Noord:benN,Zuid:Math.max(1,LOCMAP.MI.benodigd-benN)};}
function teamCols(team){
  var regs=team==='Noord'?['NW','NO']:['ZW','ZO'];
  var cols=regs.map(function(id){return colFor(id);});
  var split=midSplit();
  cols.push({key:'MI_'+team,naam:'Midden ('+team+')',type:'regio',members:['MI'],filt:function(m){return teamOf(m)===team;},benodigd:split[team],lat:LOCMAP.MI.lat,lng:LOCMAP.MI.lng});
  return cols;
}
function overNote(cols,day){
  var ov=cols.filter(function(c){return fDekking(c,day)>=100;});
  if(!ov.length)return '';
  return '<div class="ai" style="border-color:var(--ruim-bar)"><div class="hd"><span class="dot" style="background:var(--ruim-bar)"></span>Ruimte over: '+ov.map(function(c){return c.naam;}).join(', ')+'</div><p class="sub" style="margin:4px 0 0">Hier zit meer bezetting dan nodig. Meld dit bij Manager R/D voor centrale herverdeling — zo gaan monteurs niet ongecoördineerd in elkaars gebied werken.</p></div>';
}

    under.forEach(function(c){
      var sug=suggestions(c,curDay,true).slice(0,3);
      html+='<div class="ai"><div class="hd"><span class="dot"></span>'+c.naam+' · '+fDekking(c,curDay)+'%</div>';
      if(!sug.length)html+='<div class="empty">Geen monteur uit een regio die gemist kan worden zonder die regio onder norm te duwen.</div>';
      sug.forEach(function(s,i){
        html+='<div class="sugg '+(i===0?'best':'')+'"><div class="r1"><span class="nm">'+s.m.ini+' · woont '+s.m.woonNaam+'</span>'+(i===0?'<span class="badge b-ok">beste match</span>':'')+(s.buiten?' <span class="badge b-warn">buiten gebied</span>':'')+'</div><div class="meta"><span>'+s.dist+' km naar '+c.naam+'</span><span>van '+s.donor.naam+'</span></div><div class="eff"><span class="up">'+c.naam+' → '+s.targetAfter+'%</span><span class="keep">'+s.donor.naam+' blijft '+s.donorAfter+'%</span></div><button class="acc" data-prop="'+s.m.id+'|'+c.members[0]+'|'+curDay+'" style="margin-top:8px">Op agenda</button></div>';
      });
      html+='</div>';
    });
  } else html+='<div class="empty" style="margin-top:14px">Je team zit op norm vandaag.</div>';
  var mineP=proposals.filter(function(p){return p.status==='open';});
  html+='<h2>Mijn agendapunten (te bespreken)</h2>';
  if(!mineP.length)html+='<div class="empty">Nog geen voorstellen ingediend.</div>';
  mineP.forEach(function(p){var m=M.filter(function(x){return x.id===p.mid;})[0];html+='<div class="sugg" style="margin-top:8px"><div class="r1"><span class="nm">'+m.ini+' → '+LOCMAP[p.tgt].naam+'</span><button class="acc ghost" data-del="'+p.id+'">Intrekken</button></div><div class="meta"><span>'+dLabel(p.day)+'</span><span>te bespreken met R/D</span></div></div>';});
  var days='';for(var d=0;d<14;d++){days+='<td class="hm-day'+(d===TODAY?' hm-now':'')+'">'+dShort(d)+'</td>';}
  var rows='';cols.forEach(function(c){var tds='';for(var d=0;d<14;d++){var dek=fDekking(c,d);var t=tone(dek);tds+='<td class="'+(d===TODAY?'hm-now':'')+'"><div class="hm-cell" style="background:'+t.bg+';color:'+t.tx+'">'+dek+'</div></td>';}rows+='<tr><td class="hm-lab">'+c.naam+'</td>'+tds+'</tr>';});
  html+='<h2>Eigen team · 2 weken</h2><div class="hm"><table class="hm-t"><tr><td class="hm-lab"></td>'+days+'</tr>'+rows+'</table></div>';
  return html;
}

function viewAdvies(){
  var ids=scopeIds();
  var cols=ids.map(function(id){return {key:id,naam:LOCMAP[id].naam,members:[id],benodigd:LOCMAP[id].benodigd,lat:LOCMAP[id].lat,lng:LOCMAP[id].lng};});
  var under=cols.filter(function(c){return colDekking(c,curDay)<60;});
  var html='<h2>Openstaande adviezen</h2><p class="sub">'+dLabel(curDay)+' · minimale administratie: bekijk het advies en stel het voor aan Manager R/D.</p>';
  var any=false;
  under.forEach(function(c){
    var sug=suggestions(c,curDay).slice(0,1);
    if(!sug.length)return; any=true;var s=sug[0];
    html+='<div class="sugg best" style="margin-top:8px"><div class="r1"><span class="nm">'+c.naam+' · '+colDekking(c,curDay)+'% '+tone(colDekking(c,curDay)).lb+'</span><span class="badge b-ok">advies</span></div>'+
      '<div class="meta"><span>'+s.m.ini+' (woont '+s.m.woonNaam+', '+s.dist+' km)</span><span>van '+s.donor.naam+'</span></div>'+
      '<div class="eff"><span class="up">'+c.naam+' → '+s.targetAfter+'%</span><span class="keep">'+s.donor.naam+' blijft '+s.donorAfter+'%</span></div>'+
      '<div style="margin-top:8px;display:flex;gap:8px"><button class="acc" data-prop="'+s.m.id+'|'+c.key+'">Op agenda</button><button class="acc ghost" data-dis="1">Negeer</button></div></div>';
  });
  if(!any)html+='<div class="empty">Geen adviezen open vandaag. Alles op norm.</div>';
  var mineP=proposals.filter(function(p){return p.status==='open';});
  html+='<h2>Mijn agendapunten (te bespreken)</h2>';
  if(!mineP.length)html+='<div class="empty">Nog geen voorstellen ingediend.</div>';
  mineP.forEach(function(p){var m=M.filter(function(x){return x.id===p.mid;})[0];html+='<div class="sugg" style="margin-top:8px"><div class="r1"><span class="nm">'+m.ini+' → '+LOCMAP[p.tgt].naam+'</span><button class="acc ghost" data-del="'+p.id+'">Intrekken</button></div><div class="meta"><span>'+dLabel(p.day)+'</span><span>te bespreken met R/D</span></div></div>';});
  return html;
}
function wireAdvies(){
  document.querySelectorAll('[data-prop]').forEach(function(b){b.onclick=function(){var p=b.dataset.prop.split('|');pushProposal(p[0],curDay,p[1]);render();};});
  document.querySelectorAll('[data-dis]').forEach(function(b){b.onclick=function(){b.closest('.sugg').style.display='none';};});
  document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){removeProposal(+b.dataset.del);render();};});
}

/* ---------- Uitvoering: schuifbord met alleen diensten ---------- */
function viewMonteurBord(){
  var cols=columns();
  var html='<h2>Schuifbord · diensten</h2><p class="sub">'+dLabel(curDay)+' · wie draait waar dienst. Compensatie en verlof staan hier bewust niet in.</p>';
  html+='<div class="board">';
  cols.forEach(function(c){
    var working=colMonteurs(c,curDay).filter(function(m){var st=m.roster[curDay];return st==='dag'||st==='dagvroeg'||st==='waak';});
    html+='<div class="col"><h3>'+c.naam+'</h3><div class="cap">'+working.length+' op dienst</div><div class="cards">';
    if(!working.length)html+='<div class="t" style="color:var(--muted);font-size:12px;padding:4px 0">geen dienst</div>';
    working.forEach(function(m){html+='<div class="mcard"><span>'+m.ini+'</span><span class="t">'+m.roster[curDay]+'</span></div>';});
    html+='</div></div>';
  });
  html+='</div>';
  return html;
}

/* ---------- Uitvoering: eigen rooster ---------- */
function viewUitvoering(){
  var m=M[0];
  var rows='';for(var d=0;d<14;d++){rows+='<div class="row'+(d===TODAY?'':'')+'"><span>'+dLabel(d)+(d===TODAY?' · vandaag':'')+'</span><span class="t" style="color:var(--muted)">'+(dienstShow(m.roster[d],d)||'vrij')+' · '+LOCMAP[locOf(m,d)].naam+'</span></div>';}
  return '<h2>Mijn rooster</h2><p class="sub">Monteur '+m.ini+' · komende 2 weken · alleen-lezen</p><div class="list">'+rows+'</div>';
}

/* ---------- kalender 2027: 53 weken vr t/m do ---------- */
var WD_START=new Date(2027,0,1); // vrijdag 1 januari 2027
var WD_N=53;
function wdWeekStart(k){return new Date(2027,0,1+7*k);}
function wdWeekEnd(k){return new Date(2027,0,1+7*k+6);}
var WD_FEEST=(function(){
  // Pasen 2027 = zondag 28 maart
  var f=[[2027,0,1,'Nieuwjaar'],[2027,2,26,'Goede Vrijdag'],[2027,2,28,'Pasen'],[2027,2,29,'2e Paasdag'],[2027,3,27,'Koningsdag'],
         [2027,4,5,'Bevrijdingsdag'],[2027,4,6,'Hemelvaart'],[2027,4,16,'Pinksteren'],[2027,4,17,'2e Pinksterdag'],
         [2027,11,25,'Kerst'],[2027,11,26,'2e Kerstdag'],[2027,11,31,'Oudejaarsdag'],[2028,0,1,'Nieuwjaar']];
  var wk={};
  f.forEach(function(x){var d=new Date(x[0],x[1],x[2]);var k=Math.floor((d-WD_START)/864e5/7);if(k>=0&&k<WD_N){(wk[k]=wk[k]||[]).push(x[3]);}});
  return wk; // {weekIdx:[namen]}
})();
function wdIsFeest(k){return !!WD_FEEST[k];}
/* Kerst en jaarwisseling zijn de zwaarste: niemand krijgt er twee van */
function wdIsKerstNj(k){return k===0||k===51||k===52;}

/* ---------- reistijd ---------- */
function wdKm(a1,o1,a2,o2){var R=6371,r=Math.PI/180;var dA=(a2-a1)*r,dO=(o2-o1)*r;var h=Math.sin(dA/2)*Math.sin(dA/2)+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dO/2)*Math.sin(dO/2);return 2*R*Math.asin(Math.sqrt(h));}
/* grove schatting autorit: hemelsbreed × 1,25, 85 km/u, 8 min aanloop */
function wdMin(km){return 8+km*1.25/85*60;}

/* ---------- opzet voorbereiden: gebied per rastercel, thuisgebied, reistijden ---------- */
var WD_OVERRIDE={A:{},B:{},C:{},D:{}}; // gesleepte monteurs: opzet → {code: gebied}
var WD_INSTROOM_W=null;                  // {pc2: verwacht aantal storingen} — uit het instroomrapport
function wdPc2Gebied(key){var o=WD_OPZET[key],r={};(typeof PC2!=='undefined'?PC2:[]).forEach(function(p){r[p[0]]=o.assign(p[3],p[1],p[2]);});return r;}
function wdPrep(key,cells){
  var o=WD_OPZET[key];
  var gIds=o.gebieden.map(function(g){return g.id;});
  var cg=cells.map(function(c){return o.assign(c[4],c[2],c[3]);});
  var per={};gIds.forEach(function(g){per[g]=[];});
  cells.forEach(function(c,i){per[cg[i]].push(c);});
  // thuisgebied = gebied van de dichtstbijzijnde rastercel
  var home={},tijd={};
  var slots=(o.slots||o.gebieden.map(function(g){return {id:g.id,g:g.id,naam:g.naam};}));
  var slotDef={};slots.forEach(function(x){slotDef[x.id]=x;});
  WD_POOL.forEach(function(m){
    var best=1e9,bi=0;cells.forEach(function(c,i){var d=(c[3]-m.lat)*(c[3]-m.lat)+((c[2]-m.lng)*0.61)*((c[2]-m.lng)*0.61);if(d<best){best=d;bi=i;}});
    home[m.ini]=(WD_OVERRIDE[key]&&WD_OVERRIDE[key][m.ini])||(o.home&&o.home[m.ini])||cg[bi];
    tijd[m.ini]={};
    if(WD_INSTROOM_W&&typeof PC2!=='undefined'){ // gewogen naar verwachte storingen per postcode-2
      var pg=wdPc2Gebied(key),sw={},st={};gIds.forEach(function(g){sw[g]=0;st[g]=0;});
      PC2.forEach(function(p){var g=pg[p[0]],w=WD_INSTROOM_W[p[0]]||0;if(!w||sw[g]===undefined)return;sw[g]+=w;st[g]+=w*wdMin(wdKm(m.lat,m.lng,p[2],p[1]));});
      gIds.forEach(function(g){tijd[m.ini][g]=sw[g]?Math.round(st[g]/sw[g]):0;});
      gIds.forEach(function(g){if(!sw[g]){var s=0;per[g].forEach(function(c){s+=wdMin(wdKm(m.lat,m.lng,c[3],c[2]));});tijd[m.ini][g]=Math.round(s/per[g].length);}});
    } else
    gIds.forEach(function(g){var s=0;per[g].forEach(function(c){s+=wdMin(wdKm(m.lat,m.lng,c[3],c[2]));});tijd[m.ini][g]=Math.round(s/per[g].length);});
  });
  return {key:key,o:o,gIds:gIds,slots:slots,sIds:slots.map(function(x){return x.id;}),slotDef:slotDef,cellG:cg,home:home,tijd:tijd,cellsPer:per};
}

/* ---------- regels ---------- */
var WD_REGELS={grens:60,tussen:3,fac60:0.75,seeds:40,schTelt:true,geenSch60:false};
function wdG(prep,s){return s==='SCH'?'SCH':(prep.slotDef[s]?prep.slotDef[s].g:s);}
function wdFactor(m){return m.f<1?WD_REGELS.fac60:1;}
function wdMag(prep,ini,s){ // mag ini deze dienst (slot of gebied) draaien?
  if(s==='SCH'){var m=WD_POOL.filter(function(x){return x.ini===ini;})[0];return !(WD_REGELS.geenSch60&&m.f<1);}
  var sl=prep.slotDef[s];
  if(sl&&sl.wing){ // Randstad 1/2: alleen wie in de Randstad hoort, uit de juiste vleugel
    if(prep.home[ini]!==sl.g)return false;
    return wdVleugel(ini)===(sl.id==='RA1'?'noord':'zuid');
  }
  var g=wdG(prep,s);
  return prep.home[ini]===g||prep.tijd[ini][g]<=WD_REGELS.grens;
}
/* mag iemand in week k deze dienst, gezien zijn vorige waak (lw) en schaduw (ls)? */
function wdGapOk(k,lw,ls,isSch){
  var T=WD_REGELS.tussen;
  if(WD_REGELS.schTelt)return k-Math.max(lw,ls)>T;
  if(!isSch)return k-lw>T&&k-ls>=2;
  return k-lw>=2&&k-ls>=2;
}
function wdVleugel(ini){
  if(WD_COLLEGA.wing.noord.indexOf(ini)>=0)return 'noord';
  if(WD_COLLEGA.wing.zuid.indexOf(ini)>=0)return 'zuid';
  var m=WD_POOL.filter(function(x){return x.ini===ini;})[0];return m&&m.lat>=52.02?'noord':'zuid';
}
function wdPartner(ini){var p=[];WD_VERBODEN.forEach(function(v){if(v[0]===ini)p.push(v[1]);if(v[1]===ini)p.push(v[0]);});return p;}

/* rng met seed (zelfde rooster voor iedereen) */
function wdRng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* Eén poging: week voor week, krapste plek eerst, laagste (diensten / factor) wint */
function wdTry(prep,seed){
  var R=wdRng(seed),slots=prep.sIds.concat(['SCH']);
  var st={};WD_POOL.forEach(function(m){st[m.ini]={n:0,feest:0,kn:0,lw:-99,ls:-99,f:wdFactor(m)};});
  var plan=[];var leeg=0;
  for(var k=0;k<WD_N;k++){
    var wk={},bezet={},todo=slots.slice();
    while(todo.length){
      // per open plek: kandidaten
      var opts=todo.map(function(s){
        var c=WD_POOL.filter(function(m){var x=st[m.ini];
          if(bezet[m.ini])return false;
          if(!wdGapOk(k,x.lw,x.ls,s==='SCH'))return false;
          if(!wdMag(prep,m.ini,s))return false;
          if(wdPartner(m.ini).some(function(p){return bezet[p];}))return false;
          if(wdIsKerstNj(k)&&x.kn>=1)return false;
          return true;});
        return {s:s,c:c};});
      opts.sort(function(a,b){return (a.s==='SCH')-(b.s==='SCH')||a.c.length-b.c.length;});
      var o=opts[0];todo.splice(todo.indexOf(o.s),1);
      if(!o.c.length){wk[o.s]=null;leeg++;continue;}
      var best=null,bs=1e9;
      o.c.forEach(function(m){var x=st[m.ini];
        var sc=(x.n+1)/x.f*10;
        if(wdIsFeest(k))sc+=x.feest*12;
        if(o.s!=='SCH'&&prep.home[m.ini]!==wdG(prep,o.s))sc+=2+prep.tijd[m.ini][wdG(prep,o.s)]/20;
        // wie maar in weinig gebieden mag, sparen voor dat gebied
        if(o.s==='SCH')sc+=0;
        sc+=R()*1.5;
        if(sc<bs){bs=sc;best=m;}});
      wk[o.s]=best.ini;bezet[best.ini]=1;var x=st[best.ini];x.n++;if(o.s==='SCH')x.ls=k;else x.lw=k;if(wdIsFeest(k))x.feest++;if(wdIsKerstNj(k))x.kn++;
    }
    plan.push(wk);
  }
  return {plan:plan,leeg:leeg};
}
function wdScore(prep,res){
  var t=wdTel(prep,res.plan),v=0,tr=0,n=0;
  var gem=0;WD_POOL.forEach(function(m){gem+=t[m.ini].tot/wdFactor(m);});gem/=WD_POOL.length;
  WD_POOL.forEach(function(m){var d=t[m.ini].tot/wdFactor(m)-gem;v+=d*d;var fd=t[m.ini].feest;v+=fd>2?(fd-2)*4:0;});
  res.plan.forEach(function(wk){prep.sIds.forEach(function(s){if(wk[s]){tr+=prep.tijd[wk[s]][wdG(prep,s)];n++;}});});
  return res.leeg*1e5+v*10+tr/n;
}
function wdTel(prep,plan){
  var t={};WD_POOL.forEach(function(m){t[m.ini]={waak:0,sch:0,tot:0,feest:0,buiten:0,weken:[]};});
  plan.forEach(function(wk,k){Object.keys(wk).forEach(function(s){var i=wk[s];if(!i)return;var x=t[i];
    if(s==='SCH')x.sch++;else{x.waak++;if(prep.home[i]!==wdG(prep,s))x.buiten++;}
    x.tot++;if(wdIsFeest(k))x.feest++;x.weken.push({k:k,s:s});});});
  return t;
}
function wdMaak(prep,eigen){
  if(prep.o.vast&&!eigen&&!Object.keys(WD_OVERRIDE[prep.key]||{}).length)return {plan:prep.o.vast.map(function(w){var c={};for(var x in w)c[x]=w[x];return c;}),leeg:0,vast:true};
  var best=null,bs=1e18;
  for(var s=1;s<=WD_REGELS.seeds;s++){var r=wdTry(prep,s*7919+prep.key.charCodeAt(0));var sc=wdScore(prep,r);if(sc<bs){bs=sc;best=r;}}
  best.score=bs;return best;
}
/* Controle van een volledig plan → lijst {t:'vast'|'regel', ini, m}.
   vast = afgesproken regels; regel = roosterregels die we nog samen bepalen. */
function wdCheck(prep,plan){
  var fout=[],lw={},ls={},kn={};
  function add(t,ini,m){fout.push({t:t,ini:ini,m:m});}
  plan.forEach(function(wk,k){
    var inWk=[];
    Object.keys(wk).forEach(function(s){var i=wk[s];var nm=s==='SCH'?'schaduw':(prep.slotDef[s]?prep.slotDef[s].naam:s);
      if(!i){add('vast',null,'week '+(k+1)+': '+nm+' onbezet');return;}
      if(inWk.indexOf(i)>=0)add('vast',i,'week '+(k+1)+': '+i+' twee diensten tegelijk');inWk.push(i);
      var a=lw[i]===undefined?-99:lw[i],b=ls[i]===undefined?-99:ls[i];
      if(!wdGapOk(k,a,b,s==='SCH')){var vorig=Math.max(a,b);add('vast',i,'week '+(k+1)+': '+i+' te kort na dienst in week '+(vorig+1)+(WD_REGELS.schTelt?' (schaduw telt mee)':''));}
      if(s!=='SCH'&&!wdMag(prep,i,s))add('regel',i,'week '+(k+1)+': '+i+' mag '+nm+' niet draaien (reistijd of vleugel)');
      if(s==='SCH'&&!wdMag(prep,i,'SCH'))add('regel',i,'week '+(k+1)+': '+i+' is 60+ en vrijgesteld van schaduw');
      if(wdIsKerstNj(k)){kn[i]=(kn[i]||0)+1;if(kn[i]>1)add('regel',i,i+' heeft twee keer kerst/jaarwisseling');}
    });
    inWk.forEach(function(i){inWk.forEach(function(j){if(i<j&&wdPartner(i).indexOf(j)>=0)add('vast',i,'week '+(k+1)+': '+i+' en '+j+' samen');});});
    Object.keys(wk).forEach(function(s){var i=wk[s];if(!i)return;if(s==='SCH')ls[i]=k;else lw[i]=k;});
  });
  return fout;
}

var wdKey='A', wdSub='vergelijk', wdSel=null, wdAlleen=true, wdKaartIni=null, wdKaartG=null;
var wdRuilen=[], wdRuilId=1, wdCache={}, wdKaartWk=null, wdDEigen=false;
var WD_NAAM={}; // code → fictieve naam uit de tool

/* ---------- echte gegevens: alleen lokaal, alleen in het geheugen ----------
   Het bestand waakdienst-echt.json bevat echte woonplaatsen, de 60+-indicatie en het rooster van de
   collega. Het wordt nergens opgeslagen (geen localStorage, geen Supabase): herladen = weer demo. */
var WD_ECHT=null; // bestandsnaam zodra echte gegevens zijn ingeladen
function wdLaadEcht(j,naam){
  if(!j||!Array.isArray(j.pool)||!j.pool.length)throw new Error('geen pool in het bestand');
  WD_POOL=j.pool.map(function(r){return {ini:r[0],woon:r[1],lat:+r[2],lng:+r[3],f:+r[4]};});
  if(Array.isArray(j.verboden))WD_VERBODEN=j.verboden;
  if(j.collega){
    WD_COLLEGA={plan:j.collega.plan||null,home:j.collega.home||null,
      wing:j.collega.wing||{noord:[],zuid:[]},centers:j.collega.centers||WD_COLLEGA.centers};
  }
  var D=WD_OPZET.D;
  D.home=WD_COLLEGA.home;D.vast=WD_COLLEGA.plan;D.centers=WD_COLLEGA.centers;
  D.slots.forEach(function(s){if(s.id==='RA1')s.wing=WD_COLLEGA.wing.noord;if(s.id==='RA2')s.wing=WD_COLLEGA.wing.zuid;});
  // dezelfde woonplaats ook in de rest van de tool (schuifadvies rekent met afstand)
  WD_POOL.forEach(function(p){M.forEach(function(m){if(m.ini===p.ini){m.woonNaam=p.woon;m.lat=p.lat;m.lng=p.lng;}});});
  wdCache={};WD_BASE={};WD_OVERRIDE={};wdRuilen=[];wdDEigen=false;wdKaartIni=null;wdKaartG=null;wdKaartWk=null;
  WD_ECHT=naam||'eigen bestand';
}

          (ds?'<text x="'+(x+12).toFixed(0)+'" y="'+(y+4).toFixed(0)+'" font-size="12" font-weight="600" fill="var(--text)" stroke="var(--surface)" stroke-width="3" paint-order="stroke" pointer-events="none">'+m.ini+(ds==='SCH'?' · schaduw':'')+'</text>':'')+

/* ---------- echte kaart (Leaflet) ---------- */
var WD_LMAP=null, WD_LVIEW=null, WD_RING=null, WD_BASE={};
/* BRT-achtergrondkaart van PDOK: gratis, zonder sleutel, Nederlandse overheidsserver. CARTO vraagt sinds kort een API-sleutel. */
var WD_TEGELS='https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/grijs/EPSG:3857/{z}/{x}/{y}.png';
function wdRingen(path){return path.split('Z').filter(Boolean).map(function(r){return r.replace('M','').split('L').map(function(pt){var a=pt.split(',');return [GEO.LAT1-(+a[1])/GEO.S,(+a[0])/(GEO.K*GEO.S)+GEO.LNG0];});});}
function wdInRing(pt,r){var x=pt[1],y=pt[0],c=false;for(var i=0,j=r.length-1;i<r.length;j=i++){var xi=r[i][1],yi=r[i][0],xj=r[j][1],yj=r[j][0];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
function wdPcOp(lat,lng){for(var i=0;i<PC2.length;i++){var rs=WD_RING[i];for(var k=0;k<rs.length;k++)if(wdInRing([lat,lng],rs[k]))return PC2[i][0];}return null;}
function wdPinPos(){
  var by={},pos={};WD_POOL.forEach(function(m){(by[m.woon]=by[m.woon]||[]).push(m);});
  Object.keys(by).forEach(function(w){var l=by[w];l.forEach(function(m,i){var a=i/l.length*Math.PI*2;
    pos[m.ini]={lat:m.lat+(l.length>1?Math.sin(a)*0.012:0),lng:m.lng+(l.length>1?Math.cos(a)*0.02:0)};});});
  return pos;
}
function wdBase(){ // gebiedsindeling zonder handmatig verschuiven, om effect te tonen
  if(!WD_BASE[wdKey]){var keep=WD_OVERRIDE[wdKey];WD_OVERRIDE[wdKey]={};var p=wdPrep(wdKey,GEO.cells);WD_BASE[wdKey]={home:p.home};WD_OVERRIDE[wdKey]=keep;}
  return WD_BASE[wdKey];
}
function wdVerschoven(){
  var ov=Object.keys(WD_OVERRIDE[wdKey]||{}),c=wdC(),b=wdBase();
  var h='<div class="wd-card" style="margin-bottom:12px"><div class="wd-ct">Verschoven monteurs ('+ov.length+')</div>';
  if(!ov.length)return h+'<p class="wd-uitleg" style="margin:0">Nog niets verschoven. Sleep een speld op de kaart naar een ander gebied: het rooster wordt direct opnieuw berekend.</p></div>';

    h+='<div class="wd-kv"><span><b>'+i+'</b> · '+m.woon+': '+wdGNaam(c,b.home[i])+' → <b>'+wdGNaam(c,WD_OVERRIDE[wdKey][i])+'</b> · '+c.prep.tijd[i][WD_OVERRIDE[wdKey][i]]+' min</span><button class="linkbtn" data-wdundo="'+i+'">terugzetten</button></div>';});

  h+='<button class="linkbtn" data-wdundo="*" style="margin-top:6px">Alles terugzetten</button></div>';

function wdVerplaats(ini,g){

  var oud=c.prep.home[ini];
  if(wdBase().home[ini]===g)delete WD_OVERRIDE[wdKey][ini];else WD_OVERRIDE[wdKey][ini]=g;

  wdBouw();
  sbToast(ini+': '+wdGNaam(c,oud)+' → '+wdGNaam(wdC(),g)+'. Rooster opnieuw berekend.');

function wdLeaflet(){
  var el=document.getElementById('wdLmap');
  if(WD_LMAP){try{WD_LMAP.remove();}catch(e){}WD_LMAP=null;}
  if(!el)return;
  if(typeof L==='undefined'){el.innerHTML='<div class="wd-uitleg" style="padding:20px">De kaartbibliotheek kon niet laden.</div>';return;}
  if(!WD_RING)WD_RING=PC2.map(function(q){return wdRingen(q[4]);});
  var c=wdC(),key=wdKey,PCG=wdPc2Gebied(key),prep=c.prep;
  var reach=null;if(wdKaartWk==null&&wdKaartIni){reach={};prep.gIds.forEach(function(g){reach[g]=wdMagG(prep,wdKaartIni,g);});}
  var duty=null;if(wdKaartWk!=null){duty={};var dw=c.plan[wdKaartWk];Object.keys(dw).forEach(function(sl){if(dw[sl])duty[dw[sl]]=sl;});}
  function fo(g){if(reach)return reach[g]?0.6:0.08;if(wdKaartG&&wdKaartWk==null)return wdKaartG===g?0.6:0.08;return 0.32;}
  var map=WD_LMAP=L.map(el,{zoomSnap:0.25,minZoom:6,maxZoom:14});
  if(WD_LVIEW)map.setView(WD_LVIEW.c,WD_LVIEW.z,{animate:false});else map.fitBounds([[50.75,3.36],[53.55,7.23]]);
  map.on('moveend',function(){WD_LVIEW={c:map.getCenter(),z:map.getZoom()};});
  var fails=0,tl=L.tileLayer(WD_TEGELS,{attribution:'Kaartgegevens © Kadaster (PDOK)',maxZoom:19});
  tl.on('tileerror',function(){fails++;if(fails===4){var n=document.createElement('div');n.className='wd-tilenote';n.textContent='Achtergrondkaart niet bereikbaar vanaf dit netwerk — gebieden werken wel.';el.appendChild(n);}});
  tl.addTo(map);
  var lay={};
  PC2.forEach(function(q,i){var g=PCG[q[0]],k=wdKleur(key,g);
    lay[q[0]]=L.polygon(WD_RING[i],{color:k,weight:0.6,fillColor:k,fillOpacity:fo(g)}).bindTooltip('Postcode '+q[0]+'xx · '+wdGNaam(c,g),{sticky:true}).addTo(map);});
  var cen=WD_OPZET[key].centers;
  if(cen)cen.forEach(function(z){L.circle([z.lat,z.lng],{radius:z.km/1.25*1000,color:wdKleur(key,z.g),weight:1.4,dashArray:'6 5',fill:false,interactive:false}).addTo(map);
    L.marker([z.lat,z.lng],{interactive:false,icon:L.divIcon({className:'',html:'<div class="wd-stand">standplaats '+z.stad+'</div>',iconSize:[0,0]})}).addTo(map);});
  var pos=wdPinPos();
  WD_POOL.forEach(function(m){
    var g=prep.home[m.ini],mv=!!(WD_OVERRIDE[key]&&WD_OVERRIDE[key][m.ini]),q=pos[m.ini],ds=duty?duty[m.ini]:null,mine=wdIsMine(m.ini),sel=wdKaartIni===m.ini;
    var bg=ds?(ds==='SCH'?'#fff':wdKleur(key,ds)):wdKleur(key,g);
    var cls='wd-lpin'+(mv?' moved':'')+(duty&&!ds?' off':'')+(ds?' on':'')+(ds==='SCH'?' sch':'')+(sel?' sel':'')+(!mine?' other':'');
    var ic=L.divIcon({className:'',html:'<div class="'+cls+'" style="background:'+bg+'">'+m.ini+'</div>',iconSize:[24,24],iconAnchor:[12,12]});
    var mk=L.marker([q.lat,q.lng],{icon:ic,draggable:!duty,title:m.ini+' · '+m.woon+' · '+wdGNaam(c,g),keyboard:false,zIndexOffset:ds?500:(sel?400:0)}).addTo(map);
    var hot=null;
    mk.on('click',function(){wdKaartIni=wdKaartIni===m.ini?null:m.ini;wdKaartG=null;wdKaartWk=null;render();});
    mk.on('drag',function(e){var ll=e.target.getLatLng(),pc=wdPcOp(ll.lat,ll.lng),g2=pc?PCG[pc]:null;if(g2!==hot){hot=g2;PC2.forEach(function(x){lay[x[0]].setStyle({fillOpacity:PCG[x[0]]===hot?0.65:0.32});});}});
    mk.on('dragend',function(){var g2=hot;hot=null;
      if(g2&&g2!==prep.home[m.ini]){wdVerplaats(m.ini,g2);}
      else{mk.setLatLng([q.lat,q.lng]);PC2.forEach(function(x){lay[x[0]].setStyle({fillOpacity:fo(PCG[x[0]])});});}});
  });
}

/* ---------- kerncijfers per opzet ---------- */
function wdKpi(key){
  var c=wdCache[key],t=wdTel(c.prep,c.plan),ns=c.prep.sIds.length;
  var f1=[],f75=[],fe=0,bu=0,tr=0,n=0;
  WD_POOL.forEach(function(m){(m.f<1?f75:f1).push(t[m.ini].tot);fe=Math.max(fe,t[m.ini].feest);bu+=t[m.ini].buiten;});
  c.plan.forEach(function(wk){c.prep.sIds.forEach(function(s){if(wk[s]){tr+=c.prep.tijd[wk[s]][wdG(c.prep,s)];n++;}});});
  var inz=c.prep.gIds.map(function(g){var k=WD_POOL.filter(function(m){return wdMagG(c.prep,m.ini,g);}).length;return {g:g,n:k,r:k/wdNSlots(c.prep,g)};}).sort(function(a,b){return a.r-b.r;});
  function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
  var ch=wdCheck(c.prep,c.plan);
  return {gebieden:c.prep.gIds.length,slots:ns,perWeek:ns+1,tot:WD_N*(ns+1),
    f1min:Math.min.apply(null,f1),f1max:Math.max.apply(null,f1),f1avg:avg(f1),f75avg:avg(f75),f75min:Math.min.apply(null,f75),f75max:Math.max.apply(null,f75),
    buitenPct:Math.round(bu/(WD_N*ns)*100),aanrij:Math.round(tr/n),krap:inz[0],leeg:c.leeg,feestMax:fe,tel:t,
    vast:ch.filter(function(x){return x.t==='vast';}),regel:ch.filter(function(x){return x.t==='regel';})};
}

function wdDeadlineOk(k){var d=wdWeekStart(k);var nu=new Date();nu.setHours(0,0,0,0);return (d-nu)/864e5>=7;}
function wdRuilCheck(c,k1,s1,k2,s2,voorCache){
  var plan=c.plan,A=plan[k1][s1],B=plan[k2][s2],r=[];
  if(!A||!B||A===B)return ['zelfde persoon'];
  if(wdIsFeest(k1)!==wdIsFeest(k2))r.push('feestdagweek alleen ruilen tegen een feestdagweek');
  if(!wdDeadlineOk(k1)||!wdDeadlineOk(k2))r.push('minder dan 7 dagen voor de start');
  // nieuw plan doorrekenen: alleen nieuwe meldingen over A of B tellen
  var voor=voorCache;if(!voor){voor={};wdCheck(c.prep,plan).forEach(function(f){voor[f.m]=1;});}
  var na=plan.slice();na[k1]=Object.assign({},plan[k1]);if(k2!==k1)na[k2]=Object.assign({},plan[k2]);
  na[k1][s1]=B;na[k2][s2]=A;
  wdCheck(c.prep,na).forEach(function(f){if(!voor[f.m]&&(f.m.indexOf(A)>=0||f.m.indexOf(B)>=0))r.push(f.m);});
  return r;
}
function wdRuilPaneel(){
  var c=wdC(),k=wdSel.k,s=wdSel.s,A=c.plan[k][s];
  var h='<div class="ai wd-ruil"><div class="r1" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div class="hd"><span class="dot"></span>Week '+(k+1)+' · '+wdWeekLabel(k)+' · '+wdGNaam(c,s)+': '+A+' ('+wdNaam(A)+')</div><button class="acc ghost" data-wdclose="1">Sluiten</button></div>';
  h+='<div class="wd-sub2">Ook dienst deze week</div><div class="wd-chips">'+Object.keys(c.plan[k]).filter(function(x){return x!==s;}).map(function(x){var i=c.plan[k][x];return '<span class="wd-tag"><i class="wd-sw" style="background:'+wdKleur(wdKey,x)+'"></i>'+wdGNaam(c,x)+': <b>'+(i||'leeg')+'</b></span>';}).join('')+'</div>';
  var mag=wdIsMine(A)||role==='RD';
  if(!mag){h+='<div class="empty" style="margin-top:10px">'+A+' zit niet in jouw team. Een ruil voorstellen kan de teamleider van '+A+' of Manager R/D.</div></div>';return h;}
  var goed=[],fout=[],voor={};wdCheck(c.prep,c.plan).forEach(function(f){voor[f.m]=1;});
  c.plan.forEach(function(wk,k2){Object.keys(wk).forEach(function(s2){if(k2===k&&s2===s)return;var B=wk[s2];if(!B||B===A)return;
    var r=wdRuilCheck(c,k,s,k2,s2,voor);(r.length?fout:goed).push({k:k2,s:s2,B:B,r:r,d:Math.abs(k2-k)});});});
  goed.sort(function(a,b){return a.d-b.d;});fout.sort(function(a,b){return a.d-b.d;});
  h+='<div class="wd-sub2">Mag ruilen met ('+goed.length+')</div>';
  if(!goed.length)h+='<div class="empty">Geen ruil mogelijk binnen de spelregels.</div>';
  goed.slice(0,8).forEach(function(g){h+='<div class="sugg"><div class="r1"><span class="nm">'+g.B+' · '+wdNaam(g.B)+'</span><button class="acc" data-wdruil="'+k+'|'+s+'|'+g.k+'|'+g.s+'">Ruil voorstellen</button></div><div class="meta"><span>'+A+' neemt week '+(g.k+1)+' ('+wdWeekLabel(g.k)+') · '+wdGNaam(c,g.s)+'</span><span>'+g.B+' neemt week '+(k+1)+' · '+wdGNaam(c,s)+'</span></div></div>';});
  if(goed.length>8)h+='<p class="sub" style="margin-top:6px">+ '+(goed.length-8)+' verdere mogelijkheden verder in het jaar.</p>';
  h+='<details class="wd-det"><summary>Waarom niet met de anderen? (dichtstbijzijnde weken)</summary>';
  fout.slice(0,8).forEach(function(f){h+='<div class="wd-nee"><b>'+f.B+'</b> wk '+(f.k+1)+' '+wdGNaam(c,f.s)+' — '+f.r[0]+(f.r.length>1?' (+'+(f.r.length-1)+')':'')+'</div>';});
  h+='</details></div>';
  return h;
}
