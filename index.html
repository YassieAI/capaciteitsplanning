/* ================================================================
   WAAKDIENST — VOORSPELLING 2027
   Leest het instroomrapport (CSV of Excel) in de browser; er gaat niets naar een server.
   Model (uitlegbaar): niveau laatste 26 weken × trend t.o.v. vorig jaar (gedempt)
   × weekpatroon (afgevlakt, half meegewogen) × feestdageffect. Bandbreedte uit de
   fout op historie. Verdeling over postcode-2 naar aandeel van de laatste 52 weken.
   ================================================================ */
var WP=null;            // ingelezen data {rows:[{t:Date,pc:'10',prio,type}], ...}
var WP_RAW=null;        // {headers:[], data:[[...]]} ruwe tabel voor kolomkeuze
var WP_MAP=null;        // kolomkeuze
var WP_ALLEWAAK=false;  // rapport bevat al alleen waakdienst-storingen
var WP_G='ALL';         // grafiek: totaal of gebied
var WP_FC=null;         // resultaat voorspelling

/* ---------- feestdagen per jaar ---------- */
function wpPasen(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function wpFeestdagen(y){var p=wpPasen(y),d=function(n){return new Date(p.getFullYear(),p.getMonth(),p.getDate()+n);};
  var kd=new Date(y,3,27);if(kd.getDay()===0)kd=new Date(y,3,26);
  return [new Date(y,0,1),d(-2),p,d(1),kd,new Date(y,4,5),d(39),d(49),d(50),new Date(y,11,25),new Date(y,11,26),new Date(y,11,31)];}
var WP_FD={};function wpIsFeestdag(dt){var y=dt.getFullYear();if(!WP_FD[y])WP_FD[y]=wpFeestdagen(y).map(function(x){return x.toDateString();});return WP_FD[y].indexOf(dt.toDateString())>=0;}
/* ligt een melding in waakdienst-tijd? doordeweeks 19–07, weekend en feestdag 07–07 */
function wpIsWaak(t){var h=t.getHours(),dw=t.getDay();
  if(dw===0||dw===6)return true; if(h>=19||h<7)return true;
  return wpIsFeestdag(t);}
/* waakweek (vr t/m do): datum van de vrijdag */
function wpWeekVr(t){var d=new Date(t.getFullYear(),t.getMonth(),t.getDate());if(t.getHours()<7)d.setDate(d.getDate()-1);var off=(d.getDay()+2)%7;d.setDate(d.getDate()-off);return d;}
function wpWoy(fr){var mid=Date.UTC(fr.getFullYear(),fr.getMonth(),fr.getDate()+3);var j=Date.UTC(new Date(mid).getUTCFullYear(),0,1);return Math.min(52,Math.floor((mid-j)/864e5/7));} /* UTC: zomer-/wintertijd mag het weeknummer niet verschuiven */
function wpWeekHeeftFeest(fr){for(var i=0;i<7;i++){if(wpIsFeestdag(new Date(fr.getFullYear(),fr.getMonth(),fr.getDate()+i)))return true;}return false;}

/* ---------- inlezen ---------- */
function wpParseCsv(txt){
  var first=txt.split(/\r?\n/)[0]||'';var del=[';','\t',','].map(function(d){return [d,first.split(d).length];}).sort(function(a,b){return b[1]-a[1];})[0][0];
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<txt.length;i++){var ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;else if(ch===del){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(function(x){return x!=='';}))rows.push(row);row=[];}
    else cur+=ch;}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return {headers:rows[0].map(function(h){return String(h).trim();}),data:rows.slice(1)};
}
function wpRaad(headers){
  var lc=headers.map(function(h){return h.toLowerCase();});
  function zoek(woorden,niet){for(var i=0;i<lc.length;i++){if(woorden.some(function(w){return lc[i].indexOf(w)>=0;})&&!(niet||[]).some(function(w){return lc[i].indexOf(w)>=0;}))return i;}return -1;}
  return {datum:zoek(['datum','date','aangemaakt','gemeld','created','start','melding'],['eind','gereed','sluit']),
          tijd:zoek(['tijd','time','uur'],['doorloop','reis','bested']),
          pc:zoek(['postcode','pc2','pc4','zip']),
          prio:zoek(['prio','sla','urgent']),
          type:zoek(['type','soort','categorie','omschr']),
          status:zoek(['status','annul','cancel'])};
}
function wpDatum(v,tijd){
  if(v instanceof Date&&!isNaN(v))return new Date(v);
  var s=String(v||'').trim(),m,d=null;
  if(typeof v==='number'||/^\d{5}(\.\d+)?$/.test(s)){var n=+s;d=new Date(Math.round((n-25569)*864e5));d=new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes());}
  else if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/)))d=new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));
  else if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})(?:[ T](\d{1,2}):(\d{2}))?/)))d=new Date(+(m[3].length===2?'20'+m[3]:m[3]),+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));
  if(!d||isNaN(d))return null;
  if(tijd!=null&&tijd!==''){var t=String(tijd).trim(),mm;
    if(tijd instanceof Date)d.setHours(tijd.getHours(),tijd.getMinutes());
    else if((mm=t.match(/^(\d{1,2})[:.](\d{2})/)))d.setHours(+mm[1],+mm[2]);
    else if(/^0?\.\d+$/.test(t)){var f=+t*24;d.setHours(Math.floor(f),Math.round((f%1)*60));}}
  return d;
}
function wpVerwerk(){
  var R=WP_RAW,mp=WP_MAP,rows=[],geen={datum:0,pc:0,annul:0,dag:0},heeftTijd=false;
  R.data.forEach(function(r){
    var st=mp.status>=0?String(r[mp.status]||'').toLowerCase():'';
    if(/annul|cancel|vervallen/.test(st)){geen.annul++;return;}
    var t=wpDatum(r[mp.datum],mp.tijd>=0?r[mp.tijd]:null);if(!t){geen.datum++;return;}
    if(t.getHours()||t.getMinutes())heeftTijd=true;
    var pcm=String(r[mp.pc]||'').match(/\d{2}/);if(!pcm||+pcm[0]<10){geen.pc++;return;}
    rows.push({t:t,pc:pcm[0],prio:mp.prio>=0?String(r[mp.prio]||''):'',type:mp.type>=0?String(r[mp.type]||''):''});
  });
  var alle=WP_ALLEWAAK||!heeftTijd;
  var waak=alle?rows:rows.filter(function(x){if(wpIsWaak(x.t))return true;geen.dag++;return false;});
  WP={rows:waak,totaal:R.data.length,geen:geen,heeftTijd:heeftTijd,alleWaak:alle};
  wpVoorspel();
}
function wpLeesBestand(f){
  var naam=f.name.toLowerCase();
  function klaar(raw){WP_RAW=raw;WP_MAP=wpRaad(raw.headers);WP_ALLEWAAK=false;
    if(WP_MAP.datum<0||WP_MAP.pc<0){WP=null;WP_FC=null;render();sbToast('Kies hieronder welke kolom de datum en de postcode is.');return;}
    wpVerwerk();render();}
  if(/\.xlsx?$/.test(naam)){
    function metXlsx(){var rd=new FileReader();rd.onload=function(){try{var wb=XLSX.read(new Uint8Array(rd.result),{type:'array',cellDates:true});var hdr=null,data=[];wb.SheetNames.forEach(function(sn){var a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
        var hi=-1;for(var i=0;i<Math.min(15,a.length);i++){if(a[i].filter(function(x){return String(x).trim()!=='';}).length>=3){hi=i;break;}}
        if(hi<0)return;var h=a[hi].map(function(x){return String(x).trim();});if(!hdr)hdr=h;
        a.slice(hi+1).forEach(function(r){if(r.filter(function(x){return String(x).trim()!=='';}).length>=3)data.push(r);});});
      if(!hdr){sbToast('Geen gegevens gevonden in het bestand.');return;}
      klaar({headers:hdr,data:data});}catch(e){sbToast('Excel-bestand kon niet gelezen worden. Sla het op als CSV en probeer opnieuw.');}};rd.readAsArrayBuffer(f);}
    if(window.XLSX)metXlsx();else{var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.integrity='sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw';sc.crossOrigin='anonymous';sc.onload=metXlsx;sc.onerror=function(){sbToast('Excel-lezer niet bereikbaar vanaf dit netwerk. Sla het rapport op als CSV.');};document.head.appendChild(sc);}
  } else {var rd=new FileReader();rd.onload=function(){klaar(wpParseCsv(String(rd.result).replace(/^﻿/,'')));};rd.readAsText(f,'utf-8');}
}

/* ---------- model ---------- */
function wpReeks(rows){ // weektotalen per pc2, volledige weken
  var min=null,max=null;rows.forEach(function(r){if(!min||r.t<min)min=r.t;if(!max||r.t>max)max=r.t;});
  // alleen volledige weken: eerste week overslaan als de data later dan vrijdag 12:00 begint, laatste als die vóór donderdag eindigt
  var w0=wpWeekVr(min);if(min-new Date(w0.getFullYear(),w0.getMonth(),w0.getDate(),12)>0)w0=new Date(w0.getFullYear(),w0.getMonth(),w0.getDate()+7);
  var wl=wpWeekVr(max);if(max<new Date(wl.getFullYear(),wl.getMonth(),wl.getDate()+6))wl=new Date(wl.getFullYear(),wl.getMonth(),wl.getDate()-7);
  var weken=[];for(var d=new Date(w0);d<=wl;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+7))weken.push(new Date(d));
  var idx={};weken.forEach(function(w,i){idx[w.toDateString()]=i;});
  var tot=weken.map(function(){return 0;}),pc={};
  rows.forEach(function(r){var i=idx[wpWeekVr(r.t).toDateString()];if(i===undefined)return;tot[i]++;(pc[r.pc]=pc[r.pc]||weken.map(function(){return 0;}))[i]++;});
  return {weken:weken,tot:tot,pc:pc};
}
function wpFit(weken,y){ // geeft functie voorspel(vrijdag-datum) + diagnostiek
  var n=y.length,L=0,k=Math.min(26,n);for(var i=n-k;i<n;i++)L+=y[i];L/=k;
  // trend: laatste 26 weken t.o.v. dezelfde weken een jaar eerder
  var g=1;if(n>=78){var a=0,b=0;for(var j=n-26;j<n;j++){a+=y[j];b+=y[j-52];}if(b>0)g=a/b;}
  g=Math.max(0.7,Math.min(1.4,g));
  // weekpatroon: verhouding t.o.v. 13-weeks lopend gemiddelde, per weeknummer, afgevlakt en half meegewogen
  var rat={},cnt={},feestR=[];
  for(var i2=0;i2<n;i2++){var lo=Math.max(0,i2-6),hi=Math.min(n-1,i2+6),s=0,c=0;for(var q=lo;q<=hi;q++){if(q!==i2){s+=y[q];c++;}}var base=s/c;if(!base)continue;
    if(wpWeekHeeftFeest(weken[i2])){feestR.push(y[i2]/base);continue;}
    var w=wpWoy(weken[i2]);rat[w]=(rat[w]||0)+y[i2]/base;cnt[w]=(cnt[w]||0)+1;}
  var sz=[];for(var w2=0;w2<=52;w2++){var s2=0,c2=0;for(var dd=-2;dd<=2;dd++){var ww=(w2+dd+53)%53;if(cnt[ww]){s2+=rat[ww]/cnt[ww];c2++;}}sz[w2]=c2?1+0.5*(s2/c2-1):1;}

  function voorspel(fr,jaarVooruit){var f=L*Math.pow(halfjaar,jaarVooruit);return f*(wpWeekHeeftFeest(fr)?fe:sz[wpWoy(fr)]);}

  var e=[];for(var i3=Math.max(0,n-52);i3<n;i3++){var p=L*(wpWeekHeeftFeest(weken[i3])?fe:sz[wpWoy(weken[i3])]);if(p>0)e.push(y[i3]/p-1);}
  var cv=e.length?Math.sqrt(e.reduce(function(a,b){return a+b*b;},0)/e.length):0.3;

}
function wpVoorspel(){

  var fit=wpFit(R.weken,R.tot);
  // backtest: laatste 26 weken achterhouden
  var bt=null;if(n>=52){var h=26,f2=wpFit(R.weken.slice(0,n-h),R.tot.slice(0,n-h)),ape=0,apeN=0,c=0;
    var naiefL=0;for(var i=n-h-26;i<n-h;i++)naiefL+=R.tot[i];naiefL/=26;
    for(var j=n-h;j<n;j++){var p=f2.voorspel(R.weken[j],(j-(n-h)+13)/52);if(R.tot[j]>0){ape+=Math.abs(p-R.tot[j])/R.tot[j];apeN+=Math.abs(naiefL-R.tot[j])/R.tot[j];c++;}}
    bt={model:ape/c,naief:apeN/c,weken:h};}
  // aandeel per pc2 over de laatste 52 weken
  var aand={},som=0;Object.keys(R.pc).forEach(function(p){var s=0;for(var i=Math.max(0,n-52);i<n;i++)s+=R.pc[p][i];aand[p]=s;som+=s;});Object.keys(aand).forEach(function(p){aand[p]/=som||1;});
  // 2027 per week
  var laatst=R.weken[n-1],wk=[];
  for(var k=0;k<WD_N;k++){var fr=wdWeekStart(k),jv=(fr-laatst)/864e5/365.25;var f=fit.voorspel(fr,jv);
    var sd=Math.sqrt(f+Math.pow(fit.cv*f,2));wk.push({f:f,lo:Math.max(0,f-1.28*sd),hi:f+1.28*sd});}
  var W={};Object.keys(aand).forEach(function(p){W[p]=aand[p]*wk.reduce(function(a,b){return a+b.f;},0);});
  WP_FC={R:R,fit:fit,bt:bt,aand:aand,wk:wk,W:W};
  WD_INSTROOM_W=W; wdRuilen=[]; wdBouw(); // reistijden nu gewogen naar verwachte storingen
}

/* DB-type ↔ v18-status. hrs bij compensatie = nog-inzetbare uren. */
function typeToStatus(type,hrs){
  if(type==='vroeg')return 'dagvroeg';
  if(type==='dag'||type==='zara'||type==='techno')return 'dag';
  if(type==='laat')return 'waak';
  if(type==='verlof')return 'verlof:'+Math.max(1,Math.min(8,Math.round(hrs||8)));
  if(type==='ziek')return 'ziek';
  if(type==='cursus')return 'cursus';
  if(type&&type.indexOf('c-')===0){var u=Math.max(1,Math.min(8,Math.round(8-(hrs||0))));return 'comp:'+u;}
  return 'vrij';
}
function statusToRow(m,st){
  if(!st||st==='vrij')return {del:true};
  if(st==='dagvroeg')return {type:'vroeg',hrs:8};
  if(st==='dag'){var b=m.base;var tp=(b==='ZAM'||b==='ZRO'||b==='ZAR'||b==='ZZW')?'zara':(b==='TCU'?'techno':'dag');return {type:tp,hrs:8};}
  if(st==='waak')return {type:'laat',hrs:8};
  if(st==='ziek')return {type:'ziek',hrs:8};
  if(st==='cursus')return {type:'cursus',hrs:8};
  if(st.indexOf('verlof:')===0)return {type:'verlof',hrs:parseInt(st.split(':')[1],10)||8};
  if(st.indexOf('comp:')===0){var u=parseInt(st.split(':')[1],10)||8;return {type:'c-wkd',hrs:Math.max(0,8-u)};}
  return {del:true};
}

/* HTML-escape voor alles wat uit de database of van een gebruiker komt en in innerHTML belandt.
   De database is voor iedereen met de (publieke) sleutel beschrijfbaar; zonder dit kan iemand via het
   veld 'door' script laten draaien bij iedereen die de tool opent. */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function chk(res){ if(res&&res.error){console.error('[Supabase] opslaan faalde',res.error);sbToast('⚠️ Niet opgeslagen — geen verbinding met de database.');} }

async function sbLoad(){
  if(!sb)return;
  try{
    var van=isoOf(0), tot=isoOf(13);
    sbAgg={};   // week/kwartaal/jaar-aggregaten zijn na een wijziging (eigen of via realtime) verouderd
    var idxByIso={}; for(var i=0;i<14;i++)idxByIso[isoOf(i)]=i;
    var r=await sb.from('rooster_entries').select('datum,monteur,type,hrs').gte('datum',van).lte('datum',tot).limit(2000);
    if(r.error)throw r.error;
    M.forEach(function(m){for(var d=0;d<14;d++)m.roster[d]='vrij';});
    (r.data||[]).forEach(function(row){var m=MNAAM[row.monteur];var idx=idxByIso[row.datum];
      if(m&&idx!==undefined)m.roster[idx]=typeToStatus(row.type,Number(row.hrs));});
    var mv=await sb.from('stuur_moves').select('monteur,datum,loc').gte('datum',van).lte('datum',tot);
    if(!mv.error){moves={};(mv.data||[]).forEach(function(row){var m=MNAAM[row.monteur];var idx=idxByIso[row.datum];
      if(m&&idx!==undefined&&LOCMAP[row.loc])moves[m.id+':'+idx]=row.loc;});}
    var pr=await sb.from('stuur_voorstellen').select('id,monteur,datum,doel,door,status').eq('status','open');
    if(!pr.error){proposals=[];(pr.data||[]).forEach(function(row){var m=MNAAM[row.monteur];var idx=idxByIso[row.datum];
      if(!m||idx===undefined||!LOCMAP[row.doel])return;   // onbekende doellocatie zou het tabblad laten crashen
      proposals.push({id:Number(row.id),mid:m.id,day:idx,tgt:row.doel,by:String(row.door||'').slice(0,40),status:'open'});
      if(Number(row.id)>=propId)propId=Number(row.id)+1;});}
    await sbLoadNorm();   // vóór render, want elke dekking rekent met LOC.benodigd
    if(role)render();
  }catch(e){
    console.error('[Supabase] laden faalde — stuurtool draait zonder gedeelde data',e);
    sbToast('⚠️ Geen verbinding met de database (project gepauzeerd?).');
  }
}

/* Bereik-lader voor week/kwartaal-dashboards: per locatie per dag de beschikbaarheid (gewogen personen) */
var sbAgg={};
function rowWeight(row){
  var t=row.type;
  if(t==='vroeg'||t==='dag'||t==='zara'||t==='techno'||t==='laat')return 1;
  if(t&&t.indexOf('c-')===0)return Math.max(0,Math.min(1,(Number(row.hrs)||0)/8));
  return 0; // verlof / cursus / ziek
}
function ensureRange(key,vanIso,totIso){
  if(sbAgg[key])return sbAgg[key];
  if(!sb){sbAgg[key]={loaded:true,byLocDay:{}};return sbAgg[key];}
  sbAgg[key]={loaded:false,byLocDay:{}};
  // Supabase geeft max 1000 rijen per verzoek — pagineer tot alles binnen is
  (async function(){
    try{
      var alle=[], from=0, PAGE=1000;
      while(true){
        var r=await sb.from('rooster_entries').select('datum,monteur,type,hrs')
          .gte('datum',vanIso).lte('datum',totIso).order('id').range(from,from+PAGE-1);
        if(r.error)throw r.error;
        alle=alle.concat(r.data||[]);
        if(!r.data||r.data.length<PAGE)break;
        from+=PAGE;
      }
      var agg={};
      alle.forEach(function(row){
        var m=MNAAM[row.monteur]; if(!m)return;
        var w=rowWeight(row); if(!w)return;
        var loc=m.base;
        if(!agg[loc])agg[loc]={};
        agg[loc][row.datum]=(agg[loc][row.datum]||0)+w;
      });
      sbAgg[key]={loaded:true,byLocDay:agg};
    }catch(e){
      console.error('[Supabase] bereik laden faalde',e);
      sbAgg[key]={loaded:true,byLocDay:{}};
    }
    if(role)render();
  })();
  return sbAgg[key];
}
